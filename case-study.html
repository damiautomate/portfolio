    <style>
        /* ============================================================
           CSS VARIABLES — SAME AS ALL PAGES
           ============================================================ */
        :root {
            --accent: #0066FE; --accent-text: #4D94FF;
            --accent-dim: #0066FE22;
            --accent-glow: #0066FE55;
            --dark-bg: #0A0A0F;
            --dark-bg-secondary: #12121A;
            --dark-bg-card: #16161F;
            --dark-text: #E8E8ED;
            --dark-text-muted: #8888A0;
            --dark-border: #2A2A3A;
            --light-bg: #F5F3F0;
            --light-bg-secondary: #EDEAE6;
            --light-bg-card: #FFFFFF;
            --light-text: #1A1A2E;
            --light-text-muted: #6B6B80;
            --light-border: #D8D5D0;
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --container-width: 900px;
        }
        [data-theme="dark"] {
            --bg: var(--dark-bg); --bg-secondary: var(--dark-bg-secondary);
            --bg-card: var(--dark-bg-card); --text: var(--dark-text);
            --text-muted: var(--dark-text-muted); --border: var(--dark-border);
        }
        [data-theme="light"] { --accent-text: #0052E0;
            --bg: var(--light-bg); --bg-secondary: var(--light-bg-secondary);
            --bg-card: var(--light-bg-card); --text: var(--light-text);
            --text-muted: var(--light-text-muted); --border: var(--light-border);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: background 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; display: block; }
        ul { list-style: none; }
        .container {
            width: 100%;
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 clamp(1.25rem, 4vw, 2.5rem);
        }
        .container-wide {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 clamp(1.25rem, 4vw, 2.5rem);
        }

        /* ============================================================
           READING PROGRESS BAR (STICKY)
           ============================================================ */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: var(--accent);
            z-index: 1100;
            transition: width 0.1s linear;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* ============================================================
           NAVIGATION
           ============================================================ */
        .navbar {
            position: fixed;
            top: 3px;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 0;
            transition: background 0.3s, backdrop-filter 0.3s, box-shadow 0.3s;
        }
        .navbar.scrolled {
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 1px 0 var(--border);
        }
        [data-theme="dark"] .navbar.scrolled { background: rgba(10,10,15,0.85); }
        [data-theme="light"] .navbar.scrolled { background: rgba(245,243,240,0.85); }
        .navbar .container-wide { display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; }
        .nav-logo span { color: var(--accent); }
        .nav-links { display: flex; align-items: center; gap: 2rem; }
        .nav-links a { font-size: 0.88rem; font-weight: 500; color: var(--text-muted); transition: color 0.3s; letter-spacing: 0.02em; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .theme-toggle { width: 44px; height: 24px; border-radius: 12px; background: var(--border); border: none; cursor: pointer; position: relative; transition: background 0.3s; }
        .theme-toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); transition: transform 0.3s ease; }
        [data-theme="light"] .theme-toggle::after { transform: translateX(20px); }
        .theme-icon { position: absolute; top: 50%; transform: translateY(-50%); font-size: 0.65rem; line-height: 1; pointer-events: none; }
        .theme-icon.moon { left: 5px; } .theme-icon.sun { right: 5px; }
        .btn-nav { padding: 0.55rem 1.25rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; font-family: var(--font-body); background: var(--accent); color: #FFFFFF; border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-nav:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
        .nav-hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
        .nav-hamburger span { width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: 0.3s; }
        .mobile-nav { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--bg); z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; }
        .mobile-nav.active { display: flex; }
        .mobile-nav a { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--text); transition: color 0.3s; }
        .mobile-nav a:hover { color: var(--accent-text); }
        .mobile-nav-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; font-size: 1.8rem; color: var(--text); cursor: pointer; }

        /* ============================================================
           REVEAL ANIMATION
           ============================================================ */
        .reveal {
            opacity: 0; transform: translateY(30px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           HERO BANNER
           ============================================================ */
        .case-hero {
            padding-top: calc(60px + 3rem);
            padding-bottom: 0;
        }
        .case-hero-inner {
            position: relative;
        }
        .case-breadcrumb {
            display: inline-flex; align-items: center; gap: 0.4rem;
            font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.2rem;
            animation: fadeInUp 0.5s ease both;
        }
        .case-breadcrumb a { color: var(--accent); transition: opacity 0.3s; }
        .case-breadcrumb a:hover { opacity: 0.7; }

        .case-tag {
            display: inline-block; padding: 0.3rem 0.8rem; border-radius: 6px;
            font-size: 0.72rem; font-weight: 600; background: var(--accent);
            color: #FFFFFF; text-transform: uppercase; letter-spacing: 0.06em;
            margin-bottom: 1rem; animation: fadeInUp 0.5s 0.05s ease both;
        }

        .case-hero h1 {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 3.5vw, 2.6rem);
            font-weight: 800; letter-spacing: -0.03em;
            line-height: 1.15; margin-bottom: 0.8rem;
            animation: fadeInUp 0.6s 0.1s ease both;
        }
        .case-hero-subtitle {
            font-size: 1rem; color: var(--text-muted); line-height: 1.75;
            max-width: 620px; margin-bottom: 1.5rem;
            animation: fadeInUp 0.6s 0.2s ease both;
        }

        /* Key metric callout in hero */
        .hero-metric {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.6rem 1.2rem; border-radius: 10px;
            background: var(--accent-dim); border: 1px solid var(--accent);
            animation: fadeInUp 0.6s 0.3s ease both;
        }
        .hero-metric-number {
            font-family: var(--font-display); font-size: 1.5rem;
            font-weight: 800; color: var(--accent);
        }
        .hero-metric-label {
            font-size: 0.85rem; color: var(--text-muted);
        }

        /* Hero image */
        .case-hero-image {
            margin-top: 2.5rem; border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border); background: var(--bg-secondary);
            max-height: 420px; display: flex; align-items: center; justify-content: center;
            animation: fadeInUp 0.7s 0.4s ease both;
        }
        .case-hero-image img { width: 100%; height: 100%; object-fit: cover; }
        .case-hero-image .placeholder {
            padding: 4rem 2rem; color: var(--text-muted); font-size: 0.85rem; text-align: center;
        }

        /* ============================================================
           QUICK FACTS STRIP
           ============================================================ */
        .quick-facts {
            padding: 2rem 0;
            border-bottom: 1px solid var(--border);
        }
        .facts-grid {
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem;
        }
        .fact-item { flex: 1; min-width: 120px; }
        .fact-label {
            font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.3rem;
        }
        .fact-value { font-size: 0.92rem; font-weight: 600; color: var(--text); }
        .fact-tools { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .fact-tool {
            padding: 0.2rem 0.55rem; border-radius: 5px; font-size: 0.7rem;
            font-weight: 500; border: 1px solid var(--border);
            background: var(--bg-secondary); color: var(--text-muted);
        }

        /* ============================================================
           CASE STUDY CONTENT — 3-ACT STRUCTURE
           ============================================================ */
        .case-content { padding: 3.5rem 0; }

        .case-section { margin-bottom: 3.5rem; }
        .case-section:last-child { margin-bottom: 0; }

        .case-section-label {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-family: var(--font-display); font-size: 0.72rem; font-weight: 600;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
            margin-bottom: 0.8rem;
        }
        .case-section-label::before {
            content: ''; width: 18px; height: 1.5px; background: var(--accent);
        }

        .case-section h2 {
            font-family: var(--font-display); font-size: clamp(1.3rem, 2.5vw, 1.7rem);
            font-weight: 800; letter-spacing: -0.02em; line-height: 1.2;
            margin-bottom: 1rem;
        }

        .case-section p {
            font-size: 0.95rem; color: var(--text-muted); line-height: 1.85;
            margin-bottom: 1.2rem;
        }

        /* Screenshot / visual evidence */
        .case-image {
            margin: 2rem 0; border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border); background: var(--bg-secondary);
        }
        .case-image img { width: 100%; display: block; }
        .case-image .placeholder {
            padding: 3rem 2rem; text-align: center; color: var(--text-muted);
            font-size: 0.85rem;
        }
        .case-image-caption {
            padding: 0.8rem 1.2rem; font-size: 0.78rem; color: var(--text-muted);
            background: var(--bg-card); border-top: 1px solid var(--border);
        }

        /* Highlight / callout box */
        .case-callout {
            padding: 1.5rem; border-radius: 12px; border-left: 4px solid var(--accent);
            background: var(--bg-card); margin: 1.5rem 0;
        }
        .case-callout p {
            font-size: 0.92rem; color: var(--text); margin-bottom: 0;
            font-weight: 500;
        }

        /* ============================================================
           RESULTS METRICS
           ============================================================ */
        .results-metrics {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.2rem; margin: 2rem 0;
        }
        .result-card {
            padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg-card); text-align: center;
        }
        .result-number {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            font-weight: 800; color: var(--accent); line-height: 1;
            margin-bottom: 0.4rem;
        }
        .result-label {
            font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;
        }

        /* ============================================================
           CLIENT TESTIMONIAL
           ============================================================ */
        .case-testimonial {
            padding: 2.5rem 0; border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border); margin: 2rem 0;
        }
        .testimonial-inner {
            position: relative; padding-left: 1.5rem;
            border-left: 3px solid var(--accent);
        }
        .testimonial-inner::before {
            content: '\201C'; font-family: var(--font-display); font-size: 4rem;
            font-weight: 800; color: var(--accent); opacity: 0.15;
            position: absolute; top: -1.2rem; left: 1.5rem; line-height: 1;
        }
        .testimonial-quote {
            font-size: 1.05rem; color: var(--text); line-height: 1.85;
            font-style: italic; margin-bottom: 1.2rem;
        }
        .testimonial-author { display: flex; align-items: center; gap: 0.8rem; }
        .testimonial-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--accent-dim); display: flex; align-items: center;
            justify-content: center; font-family: var(--font-display);
            font-weight: 700; font-size: 0.85rem; color: var(--accent-text);
        }
        .testimonial-name { font-weight: 600; font-size: 0.9rem; }
        .testimonial-role { font-size: 0.78rem; color: var(--text-muted); }

        /* ============================================================
           TOOLS USED STRIP
           ============================================================ */
        .tools-section {
            padding: 2rem 0; border-top: 1px solid var(--border);
        }
        .tools-section-label {
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.8rem;
        }
        .tools-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .tool-badge {
            padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-secondary); font-size: 0.82rem; font-weight: 500;
            color: var(--text); transition: border-color 0.3s, background 0.3s;
        }
        .tool-badge:hover { border-color: var(--accent); background: var(--accent-dim); }

        /* ============================================================
           PREV / NEXT PROJECT NAVIGATION
           ============================================================ */
        .project-nav {
            padding: 2.5rem 0; border-top: 1px solid var(--border);
        }
        .project-nav-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;
        }
        .project-nav-item {
            padding: 1.5rem; border-radius: 14px; border: 1px solid var(--border);
            background: var(--bg-card); transition: border-color 0.3s, transform 0.2s;
            display: flex; flex-direction: column;
        }
        .project-nav-item:hover {
            border-color: var(--accent); transform: translateY(-2px);
        }
        .project-nav-item.next { text-align: right; align-items: flex-end; }
        .project-nav-direction {
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.4rem;
        }
        .project-nav-title {
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
        }
        .project-nav-category {
            font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem;
        }

        /* ============================================================
           CTA SECTION
           ============================================================ */
        .cta-section {
            text-align: center; padding: clamp(3rem, 8vw, 5rem) 0;
            position: relative; overflow: hidden;
        }
        .cta-section::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
            border-radius: 50%; pointer-events: none;
        }
        .cta-content { position: relative; z-index: 1; }
        .section-label {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-family: var(--font-display); font-size: 0.78rem; font-weight: 600;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text);
            margin-bottom: 1rem;
        }
        .section-label::before { content: ''; width: 20px; height: 1.5px; background: var(--accent); }
        .section-title {
            font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 0.8rem;
        }
        .section-subtitle {
            font-size: 0.92rem; color: var(--text-muted); max-width: 460px;
            margin: 0 auto 2rem; line-height: 1.7;
        }
        .btn-primary {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.85rem 2rem; border-radius: 10px; font-family: var(--font-body);
            font-size: 0.95rem; font-weight: 600; background: var(--accent);
            color: #FFFFFF; border: none; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow); }

        /* ============================================================
           FOOTER
           ============================================================ */
        footer { border-top: 1px solid var(--border); padding: 3rem 0; }
        .footer-content { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem; }
        .footer-left { font-size: 0.85rem; color: var(--text-muted); }
        .footer-left strong { color: var(--text); font-family: var(--font-display); }
        .footer-legal { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; opacity: 0.75; transition: color 0.2s, opacity 0.2s; }
        .footer-legal:hover { color: var(--accent-text); opacity: 1; }
        .footer-socials { display: flex; gap: 0.6rem; }
        .social-icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); display: flex; align-items: center; justify-content: center; transition: border-color 0.3s, background 0.3s, transform 0.2s; color: var(--text-muted); }
        .social-icon:hover { border-color: var(--accent-text); background: var(--accent-dim); color: var(--accent-text); transform: translateY(-2px); }
        .social-icon svg { width: 18px; height: 18px; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 900px) {
            .nav-links { display: none; }
            .nav-hamburger { display: flex; }
            .btn-nav { display: none; }
            .project-nav-grid { grid-template-columns: 1fr; }
            .project-nav-item.next { text-align: left; align-items: flex-start; }
            .footer-content { flex-direction: column; text-align: center; }
            .footer-socials { justify-content: center; flex-wrap: wrap; }
        }
        @media (max-width: 600px) {
            .case-hero h1 { font-size: 1.6rem; }
            .facts-grid { flex-direction: column; gap: 1rem; }
            .results-metrics { grid-template-columns: 1fr 1fr; }
        }

        /* Cookie banner (GA4 consent) */
        .cookie-banner { position: fixed; bottom: 1.2rem; left: 1.2rem; right: 1.2rem; max-width: 680px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; z-index: 500; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: none; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .cookie-banner.visible { display: flex; }
        .cookie-banner-text { flex: 1; font-size: 0.85rem; color: var(--text-muted); min-width: 280px; }
        .cookie-banner-text strong { color: var(--text); }
        .cookie-banner-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
        .cookie-btn { padding: 0.55rem 1.2rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text); cursor: pointer; transition: all 0.2s; }
        .cookie-btn.primary { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
        .cookie-btn:hover { transform: translateY(-1px); }
    </style>
</head>
<body>

    <!-- INITIAL SPLASH — fixes FOUC -->
    <div id="initialSplash" style="position:fixed;inset:0;z-index:10000;background:#0A0A0F;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s ease, visibility 0.4s;">

    function esc(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ============================================================
    // SHARED: Apply favicon, OG tags, schema.org to <head>
    // ============================================================
    function applyMetaTags(d, pageTitle, pageDesc) {
        if (!d) return;
        const head = document.head;
        const title = pageTitle || d.meta?.title || '';
        const desc = pageDesc || d.meta?.description || '';

        if (d.meta?.faviconUrl) {
            let fav = head.querySelector('link[rel="icon"]');
            if (!fav) { fav = document.createElement('link'); fav.setAttribute('rel', 'icon'); head.appendChild(fav); }
            fav.setAttribute('href', d.meta.faviconUrl);
        }

        function setMeta(selector, attrs, value) {
            if (!value) return;
            let el = head.querySelector(selector);
            if (!el) {
                el = document.createElement('meta');
                Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
                head.appendChild(el);
            }
            el.setAttribute('content', value);
        }

        const ogImage = d.meta?.ogImage || d.about?.photoUrl || '';
        setMeta('meta[property="og:title"]', { property: 'og:title' }, title);
        setMeta('meta[property="og:description"]', { property: 'og:description' }, desc);
        setMeta('meta[property="og:type"]', { property: 'og:type' }, 'article');
        setMeta('meta[property="og:image"]', { property: 'og:image' }, ogImage);
        setMeta('meta[property="og:url"]', { property: 'og:url' }, window.location.href);
        setMeta('meta[name="twitter:card"]', { name: 'twitter:card' }, 'summary_large_image');
        setMeta('meta[name="twitter:title"]', { name: 'twitter:title' }, title);
        setMeta('meta[name="twitter:description"]', { name: 'twitter:description' }, desc);
        setMeta('meta[name="twitter:image"]', { name: 'twitter:image' }, ogImage);
    }

    // ============================================================
    // GA4 ANALYTICS (with cookie consent)
    // ============================================================
    function setupAnalytics(d) {
        const ga4Id = d.meta?.ga4MeasurementId;
        if (!ga4Id || !/^G-[A-Z0-9]+$/.test(ga4Id)) return;
        const cookieBannerEnabled = d.meta?.cookieBannerEnabled !== false;
        let consent = null;
        try { consent = localStorage.getItem('ga_consent'); } catch(e) {}
        if (consent === 'accepted') loadGA4(ga4Id);
        else if (consent === 'declined') return;
        else if (cookieBannerEnabled) showCookieBanner(ga4Id);
        else loadGA4(ga4Id);
    }
    function loadGA4(id) {
        if (window.__ga4Loaded) return;
        window.__ga4Loaded = true;
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
        document.head.appendChild(script);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', id, { anonymize_ip: true });
    }
    function showCookieBanner(id) {
        const banner = document.getElementById('cookieBanner');
        if (!banner) return;
        banner.classList.add('visible');
        document.getElementById('cookieAccept').addEventListener('click', () => {
            try { localStorage.setItem('ga_consent', 'accepted'); } catch(e) {}
            banner.classList.remove('visible');
            loadGA4(id);
        });
        document.getElementById('cookieDecline').addEventListener('click', () => {
            try { localStorage.setItem('ga_consent', 'declined'); } catch(e) {}
            banner.classList.remove('visible');
        });
    }

    // Get case study ID from URL: case-study.html?id=njs-royale
    function getCaseStudyId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id') || '';
    }

    function renderNotFound(message) {
        document.getElementById('caseContent').innerHTML = `

                    <a href="projects.html" class="btn-primary">
                        Back to Projects
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </a>
                </div>
            </section>`;
    }

    // ============================================================
    // RENDER CASE STUDY FROM DATA
    // ============================================================
    function renderCaseStudy(data, caseId) {
        // Setup theme
        try { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.setAttribute('data-theme', data.theme.defaultTheme); } catch(e) {}
        // Brand accent is #0066FE and lives in CSS. Only a genuinely custom accent
        // chosen in admin may override it -- never the retired teal, which
        // published Firestore documents still contain and which would otherwise
        // undo the rebrand at runtime, on the live site only.
        const __brandAccent = (data.theme.accentColor || '').trim().toUpperCase();
        if (__brandAccent && __brandAccent !== '#00D4AA' && __brandAccent !== '#0066FE') {
            document.documentElement.style.setProperty('--accent', __brandAccent);
            document.documentElement.style.setProperty('--accent-dim', __brandAccent + '22');
            document.documentElement.style.setProperty('--accent-glow', __brandAccent + '55');
            document.documentElement.style.setProperty('--accent-text', __brandAccent);
        }

        // Nav
        document.getElementById('navLogo').innerHTML = data.nav.logo + '<span>.</span>';
        const bookBtn = document.getElementById('navBookBtn');
        const _d = data;
        const _bookHref = (_d.bookingPage && _d.bookingPage.enabled !== false) ? 'book.html' : _d.nav.bookingUrl;
        bookBtn.href = _bookHref;
        bookBtn.textContent = _d.nav.bookingText;
        if (_bookHref === 'book.html') { bookBtn.removeAttribute('target'); bookBtn.removeAttribute('rel'); }

        // Footer
        document.getElementById('footerLeft').innerHTML = `<strong>${esc(data.footer.name)}</strong><br>&copy; ${data.footer.year} — All rights reserved.<br><a href="privacy.html" class="footer-legal">Privacy Policy</a>`;
        document.getElementById('footerSocials').innerHTML = data.footer.socials.map(s =>
            `<a href="${s.url}" target="_blank" class="social-icon" aria-label="${esc(s.platform)}"><svg viewBox="0 0 24 24" fill="currentColor">${SOCIAL_ICONS[s.icon] || ''}</svg></a>`
        ).join('');

        // Find the case study
        const cs = (data.caseStudies || {})[caseId];
        if (!cs) {
            renderNotFound(`No case study with ID "${caseId}".`);
            return;
        }

        // Set page title + meta
        document.title = cs.meta.title;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', cs.meta.description);
        applyMetaTags(data, cs.meta.title, cs.meta.description);

        // Use hero image as OG for this specific case study
        if (cs.hero.heroImage) {
            const ogImg = document.querySelector('meta[property="og:image"]');
            if (ogImg) ogImg.setAttribute('content', cs.hero.heroImage);
            const twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg) twImg.setAttribute('content', cs.hero.heroImage);
        }

        // Build main content
        const heroImage = cs.hero.heroImage
            ? `<img src="${esc(cs.hero.heroImage)}" alt="${esc(cs.hero.title)}">`
            : `<div class="placeholder">${esc(cs.hero.heroCaption || 'Hero screenshot')}</div>`;

        const challengeBullets = (cs.challenge.bullets || []).length > 0
            ? `<ul class="case-bullets">${cs.challenge.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`
            : '';

        const challengeCallout = cs.challenge.callout
            ? `<div class="case-callout"><p>${esc(cs.challenge.callout)}</p></div>`
            : '';

        const solutionPhases = (cs.solution.phases || []).map(phase => {
            const imgHtml = phase.image
                ? `<div class="case-image"><img src="${esc(phase.image)}" alt="${esc(phase.title)}" loading="lazy" decoding="async"><div class="case-image-caption">${esc(phase.imageCaption || '')}</div></div>`
                : (phase.imageCaption ? `<div class="case-image"><div class="placeholder">${esc(phase.imageCaption)}</div><div class="case-image-caption">${esc(phase.imageCaption)}</div></div>` : '');
            return `<p><strong>Phase ${esc(phase.number)} — ${esc(phase.title)}:</strong> ${esc(phase.description)}</p>${imgHtml}`;
        }).join('');

        const metricsHtml = cs.results.metrics.map(m =>
            `<div class="result-card">
                <div class="result-number" data-target="${m.number}" data-suffix="${esc(m.suffix)}">0${esc(m.suffix)}</div>
                <div class="result-label">${esc(m.label)}</div>
            </div>`
        ).join('');

        const resultsParagraphs = cs.results.paragraphs.map(p => `<p>${esc(p)}</p>`).join('');

        const toolsHtml = (cs.tools || []).map(t => `<span class="tool-badge">${esc(t)}</span>`).join('');

        // Prev/next nav
        const allIds = Object.keys(data.caseStudies);
        let prevId = cs.nav?.prevId, nextId = cs.nav?.nextId;
        if (!prevId && !nextId && allIds.length > 1) {
            // Auto-derive from order
            const idx = allIds.indexOf(caseId);
            prevId = idx > 0 ? allIds[idx - 1] : '';
            nextId = idx < allIds.length - 1 ? allIds[idx + 1] : '';
        }
        const prevCase = prevId ? data.caseStudies[prevId] : null;
        const nextCase = nextId ? data.caseStudies[nextId] : null;
        let prevNextHtml = '';
        if (prevCase || nextCase) {
            prevNextHtml = `<section class="project-nav"><div class="container"><div class="project-nav-grid">`;
            if (prevCase) {
                prevNextHtml += `<a href="case-study.html?id=${encodeURIComponent(prevId)}" class="project-nav-item prev">
                    <span class="project-nav-direction">← Previous Project</span>
                    <span class="project-nav-title">${esc(prevCase.hero.title)}</span>
                    <span class="project-nav-category">${esc(prevCase.hero.tag)}</span>
                </a>`;
            } else {
                prevNextHtml += `<div></div>`;
            }
            if (nextCase) {
                prevNextHtml += `<a href="case-study.html?id=${encodeURIComponent(nextId)}" class="project-nav-item next">
                    <span class="project-nav-direction">Next Project →</span>
                    <span class="project-nav-title">${esc(nextCase.hero.title)}</span>
                    <span class="project-nav-category">${esc(nextCase.hero.tag)}</span>
                </a>`;
            } else {
                prevNextHtml += `<div></div>`;
            }
            prevNextHtml += `</div></div></section>`;
        }

        // Full HTML
        document.getElementById('caseContent').innerHTML = `
            <!-- HERO -->
            <section class="case-hero">
                <div class="container">
                    <div class="case-breadcrumb">
                        <a href="index.html">Home</a> <span>/</span>
                        <a href="projects.html">Projects</a> <span>/</span>
                        <span>${esc(cs.hero.client || cs.hero.title)}</span>
                    </div>
                    <span class="case-tag">${esc(cs.hero.tag)}</span>
                    <h1>${esc(cs.hero.title)}</h1>
                    ${cs.hero.client ? `<div class="case-hero-client">${esc(cs.hero.client)}</div>` : ''}
                    <p class="case-hero-subtitle">${esc(cs.hero.subtitle)}</p>
                    ${cs.hero.metric ? `<div class="hero-metric">
                        <span class="hero-metric-number">${esc(cs.hero.metric.number)}</span>
                        <span class="hero-metric-label">${esc(cs.hero.metric.label)}</span>
                    </div>` : ''}
                    <div class="case-hero-image">${heroImage}</div>
                </div>
            </section>

            <!-- QUICK FACTS -->
            <section class="quick-facts">
                <div class="container">
                    <div class="facts-grid reveal">
                        ${cs.quickFacts.client ? `<div class="fact-item"><div class="fact-label">Client</div><div class="fact-value">${esc(cs.quickFacts.client)}</div></div>` : ''}
                        <div class="fact-item"><div class="fact-label">Industry</div><div class="fact-value">${esc(cs.quickFacts.industry)}</div></div>
                        <div class="fact-item"><div class="fact-label">Timeline</div><div class="fact-value">${esc(cs.quickFacts.timeline)}</div></div>
                        <div class="fact-item"><div class="fact-label">My Role</div><div class="fact-value">${esc(cs.quickFacts.role)}</div></div>
                        <div class="fact-item"><div class="fact-label">Tools</div><div class="fact-tools">
                            ${(cs.quickFacts.tools || []).map(t => `<span class="fact-tool">${esc(t)}</span>`).join('')}
                        </div></div>
                    </div>
                </div>
            </section>

            <!-- CONTENT -->
            <article class="case-content">
                <div class="container">
                    <!-- ACT 1 -->
                    <div class="case-section reveal">
                        <span class="case-section-label">${esc(cs.challenge.label)}</span>
                        <h2>${esc(cs.challenge.title)}</h2>
                        ${cs.challenge.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
                        ${challengeBullets}
                        ${challengeCallout}
                    </div>

                    <!-- ACT 2 -->
                    <div class="case-section reveal">
                        <span class="case-section-label">${esc(cs.solution.label)}</span>
                        <h2>${esc(cs.solution.title)}</h2>
                        ${cs.solution.intro ? `<p>${esc(cs.solution.intro)}</p>` : ''}
                        ${solutionPhases}
                    </div>

                    <!-- ACT 3 -->
                    <div class="case-section reveal">
                        <span class="case-section-label">${esc(cs.results.label)}</span>
                        <h2>${esc(cs.results.title)}</h2>
                        <div class="results-metrics" id="resultsMetrics">${metricsHtml}</div>
                        ${resultsParagraphs}
                    </div>
                </div>
            </article>

            ${cs.testimonial && cs.testimonial.quote ? `
            <!-- TESTIMONIAL -->
            <section class="case-testimonial">
                <div class="container">
                    <div class="testimonial-inner reveal">
                        <p class="testimonial-quote">"${esc(cs.testimonial.quote)}"</p>
                        <div class="testimonial-author">
                            <div class="testimonial-avatar">${esc(cs.testimonial.initials)}</div>
                            <div>
                                <div class="testimonial-name">${esc(cs.testimonial.name)}</div>
                                <div class="testimonial-role">${esc(cs.testimonial.role)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>` : ''}

            <!-- TOOLS -->
            ${toolsHtml ? `<section class="tools-section">
                <div class="container">
                    <div class="tools-section-label">Tools & Platforms Used</div>
                    <div class="tools-list">${toolsHtml}</div>
                </div>
            </section>` : ''}

            ${prevNextHtml}

            <!-- CTA -->
            ${cs.cta ? `<section class="cta-section">
                <div class="container">
                    <div class="cta-content reveal">
                        <span class="section-label">${esc(cs.cta.sectionLabel)}</span>
                        <h2 class="section-title">${esc(cs.cta.title)}</h2>
                        <p class="section-subtitle">${esc(cs.cta.subtitle)}</p>
                        <a href="${esc(cs.cta.buttonUrl)}" target="_blank" class="btn-primary">
                            ${esc(cs.cta.buttonText)}
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </a>
                    </div>
                </div>
            </section>` : ''}
        `;

        initInteractions();
        setupAnalytics(data);
        if (typeof window.__loadTawkTo === "function") window.__loadTawkTo(data);
    }

    function initInteractions() {
        // Reveal
        const obs = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
        document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

        // Counter animation
        const rm = document.getElementById('resultsMetrics');
        if (rm) {
            const ro = new IntersectionObserver((entries) => {
                entries.forEach(en => {
                    if (en.isIntersecting) {
                        en.target.querySelectorAll('[data-target]').forEach(el => {
                            if (el.dataset.animated) return;
                            el.dataset.animated = '1';
                            const t = parseInt(el.dataset.target), s = el.dataset.suffix || '', d = 3000, st = performance.now();
                            function ease(x) { return 1 - Math.pow(1 - x, 3); }
                            function tick(now) { const p = Math.min((now - st) / d, 1); el.textContent = Math.floor(ease(p) * t) + s; if (p < 1) requestAnimationFrame(tick); else el.textContent = t + s; }
                            requestAnimationFrame(tick);
                        });
                        ro.unobserve(en.target);
                    }
                });
            }, { threshold: 0.3 });
            ro.observe(rm);
        }
    }

    // Static elements
    document.getElementById('themeToggle').addEventListener('click', () => {
        const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', n);
        try { localStorage.setItem('theme', n); } catch(e) {}
    });
    window.addEventListener('scroll', () => {
        document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
        const p = document.documentElement.scrollHeight - window.innerHeight;
        document.getElementById('progressBar').style.width = (p > 0 ? (window.scrollY / p) * 100 : 0) + '%';
    });
    document.getElementById('navHamburger').addEventListener('click', () => document.getElementById('mobileNav').classList.add('active'));
    document.getElementById('mobileNavClose').addEventListener('click', () => document.getElementById('mobileNav').classList.remove('active'));
    function closeMobileNav() { document.getElementById('mobileNav').classList.remove('active'); }

    // Boot
    const FIRESTORE_CACHE_KEY = 'siteContentCache';

    function dismissSplash() {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const splash = document.getElementById('initialSplash');
                if (splash) splash.classList.add('loaded');
                setTimeout(() => { if (splash) splash.remove(); }, 500);
            });
        });
    }

    function bootSite() {
        const caseId = getCaseStudyId();
        if (!caseId) { renderNotFound('No case study ID specified in the URL.'); dismissSplash(); return; }

        // Step 1: Render immediately from best available source
        let renderedFromCache = false;
        let initialRender = null;
        try {
            const cached = localStorage.getItem(FIRESTORE_CACHE_KEY);
            if (cached) {
                const parsed = JSON.parse(cached);
                if (parsed.caseStudies) { initialRender = parsed; renderedFromCache = true; }
            }
        } catch(e) {}
        if (!initialRender && typeof SITE_DATA !== 'undefined') {
            initialRender = SITE_DATA;
        }

        if (initialRender) {
            renderCaseStudy(initialRender, caseId);
            dismissSplash();
        } else {
            setTimeout(dismissSplash, 1500);
        }

        // Step 2: Firestore refresh in background
        const oldCacheJson = renderedFromCache ? localStorage.getItem(FIRESTORE_CACHE_KEY) : null;
        try {
            firebase.initializeApp(firebaseConfig);
            firebase.firestore().collection(SITE_DOC_PATH.collection).doc(SITE_DOC_PATH.doc).get()
                .then(doc => {
                    if (!doc.exists) return;
                    const fresh = doc.data();
                    const freshJson = JSON.stringify(fresh);
                    if (freshJson !== oldCacheJson) {
                        renderCaseStudy(fresh, caseId);
                    }
                    try { localStorage.setItem(FIRESTORE_CACHE_KEY, freshJson); } catch(e) {}
                })
                .catch(err => console.warn('Firestore fetch failed:', err));
        } catch(e) {
            console.warn('Firebase init failed:', e);
        }
    }
    bootSite();
    </script>

</body>
