<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Loading...</title>
    <meta name="description" id="pageMeta" content="">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           ALL CSS IS IDENTICAL TO YOUR ORIGINAL HOMEPAGE
           Copied exactly — no changes needed here
           ============================================================ */
        :root {
            --accent: #00D4AA;
            --accent-dim: #00D4AA22;
            --accent-glow: #00D4AA40;
            --dark-bg: #0A0A0F;
            --dark-bg-secondary: #12121A;
            --dark-bg-card: #16161F;
            --dark-text: #E8E8ED;
            --dark-text-muted: #8888A0;
            --dark-border: #2A2A3A;
            --light-bg: #F5F3F0;
            --light-bg-secondary: #EDEAE6;
            --light-bg-card: #FFFFFF;
            --light-text: #1A1A2E;
            --light-text-muted: #6B6B80;
            --light-border: #D8D5D0;
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --section-padding: clamp(4rem, 10vw, 8rem);
            --container-width: 1200px;
        }

        [data-theme="dark"] { --bg: var(--dark-bg); --bg-secondary: var(--dark-bg-secondary); --bg-card: var(--dark-bg-card); --text: var(--dark-text); --text-muted: var(--dark-text-muted); --border: var(--dark-border); }
        [data-theme="light"] { --bg: var(--light-bg); --bg-secondary: var(--light-bg-secondary); --bg-card: var(--light-bg-card); --text: var(--light-text); --text-muted: var(--light-text-muted); --border: var(--light-border); }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 80px; }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.7; transition: background 0.4s ease, color 0.4s ease; overflow-x: hidden; }
        a { color: inherit; text-decoration: none; } img { max-width: 100%; display: block; } ul { list-style: none; }
        .container { width: 100%; max-width: var(--container-width); margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 2.5rem); }

        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .reveal-delay-1 { transition-delay: 0.1s; } .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; } .reveal-delay-4 { transition-delay: 0.4s; }

        /* NAV */
        .navbar { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 1rem 0; transition: background 0.3s ease, backdrop-filter 0.3s ease, box-shadow 0.3s ease; }
        .navbar.scrolled { background: var(--bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 1px 0 var(--border); }
        [data-theme="dark"] .navbar.scrolled { background: rgba(10,10,15,0.85); }
        [data-theme="light"] .navbar.scrolled { background: rgba(245,243,240,0.85); }
        .navbar .container { display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; }
        .nav-logo span { color: var(--accent); }
        .nav-links { display: flex; align-items: center; gap: 2rem; }
        .nav-links a { font-size: 0.88rem; font-weight: 500; color: var(--text-muted); transition: color 0.3s; letter-spacing: 0.02em; }
        .nav-links a:hover { color: var(--accent); }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .theme-toggle { width: 44px; height: 24px; border-radius: 12px; background: var(--border); border: none; cursor: pointer; position: relative; transition: background 0.3s; }
        .theme-toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); transition: transform 0.3s ease; }
        [data-theme="light"] .theme-toggle::after { transform: translateX(20px); }
        .theme-icon { position: absolute; top: 50%; transform: translateY(-50%); font-size: 0.65rem; line-height: 1; pointer-events: none; }
        .theme-icon.moon { left: 5px; } .theme-icon.sun { right: 5px; }
        .btn-nav { padding: 0.55rem 1.25rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; font-family: var(--font-body); background: var(--accent); color: #0A0A0F; border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-nav:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
        .nav-hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
        .nav-hamburger span { width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: 0.3s; }
        .mobile-nav { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--bg); z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; }
        .mobile-nav.active { display: flex; }
        .mobile-nav a { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--text); transition: color 0.3s; }
        .mobile-nav a:hover { color: var(--accent); }
        .mobile-nav-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; font-size: 1.8rem; color: var(--text); cursor: pointer; }

        /* HERO */
        .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 80px; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 60px 60px; opacity: 0.3; mask-image: radial-gradient(ellipse at 30% 50%, black 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 30% 50%, black 20%, transparent 70%); }
        .hero::after { content: ''; position: absolute; top: 20%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
        .hero-content { position: relative; z-index: 1; max-width: 800px; }
        .hero-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; border-radius: 50px; border: 1px solid var(--border); background: var(--bg-secondary); font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.2rem; animation: fadeInUp 0.8s ease forwards; }
        .hero-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hero h1 { font-family: var(--font-display); font-size: clamp(2.2rem, 4.2vw, 3.5rem); font-weight: 800; line-height: 1.12; letter-spacing: -0.03em; margin-bottom: 1.2rem; animation: fadeInUp 0.8s 0.15s ease both; }
        .hero h1 .highlight { color: var(--accent); }
        .hero-description { font-size: clamp(0.95rem, 1.5vw, 1.1rem); color: var(--text-muted); max-width: 580px; margin-bottom: 2rem; line-height: 1.75; animation: fadeInUp 0.8s 0.3s ease both; }
        .hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; animation: fadeInUp 0.8s 0.45s ease both; }
        .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 2rem; border-radius: 10px; font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; background: var(--accent); color: #0A0A0F; border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow); }
        .btn-secondary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 2rem; border-radius: 10px; font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; background: transparent; color: var(--text); border: 1.5px solid var(--border); cursor: pointer; transition: border-color 0.3s, background 0.3s; }
        .btn-secondary:hover { border-color: var(--accent); background: var(--accent-dim); }
        .hero-trust { display: flex; gap: 2.5rem; margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--border); animation: fadeInUp 0.8s 0.6s ease both; }
        .trust-item { display: flex; flex-direction: column; }
        .trust-number { font-family: var(--font-display); font-size: clamp(2rem, 3vw, 2.8rem); font-weight: 800; color: var(--accent); }
        .trust-label { font-size: 0.9rem; color: var(--text-muted); }

        /* SECTIONS */
        section { padding: var(--section-padding) 0; }
        .section-label { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--font-display); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
        .section-label::before { content: ''; width: 20px; height: 1.5px; background: var(--accent); }
        .section-title { font-family: var(--font-display); font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 0.8rem; }
        .section-subtitle { font-size: 0.95rem; color: var(--text-muted); max-width: 550px; line-height: 1.7; }

        /* ABOUT */
        .about-grid { display: grid; grid-template-columns: 0.75fr 1.25fr; gap: 3.5rem; align-items: start; margin-top: 2.5rem; }
        .about-image-wrapper { position: relative; }
        .about-image { width: 100%; aspect-ratio: 3/4; border-radius: 16px; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border); position: relative; }
        .about-image img { width: 100%; height: 100%; object-fit: cover; }
        .about-image-wrapper::after { content: ''; position: absolute; bottom: -12px; right: -12px; width: 50%; height: 50%; border: 2px solid var(--accent); border-radius: 16px; z-index: -1; opacity: 0.3; }
        .about-text p { color: var(--text-muted); margin-bottom: 1rem; font-size: 0.92rem; line-height: 1.75; }
        .about-text strong { color: var(--text); font-weight: 600; }
        .about-tagline { color: var(--text) !important; font-size: 0.95rem !important; font-weight: 500; margin-top: 0.4rem; padding-left: 1rem; border-left: 3px solid var(--accent); }
        .tools-strip { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
        .tools-strip-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.8rem; display: block; }
        .tools-badges { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .tool-badge { padding: 0.5rem 1.1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); font-size: 0.82rem; font-weight: 500; color: var(--text); transition: border-color 0.3s, background 0.3s; }
        .tool-badge:hover { border-color: var(--accent); background: var(--accent-dim); }

        /* SERVICES */
        .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 3rem; }
        .service-card { padding: 2rem; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden; }
        .service-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.15); }
        .service-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); opacity: 0; transition: opacity 0.3s; }
        .service-card:hover::before { opacity: 1; }
        .service-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 1.2rem; }
        .service-card h3 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem; }
        .service-card p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.7; }

        /* PROJECTS */
        .projects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 3rem; }
        .project-card { border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); overflow: hidden; transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s; }
        .project-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.15); }
        .project-image { width: 100%; height: 200px; background: var(--bg-secondary); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .project-image img { width: 100%; height: 100%; object-fit: cover; }
        .project-image-placeholder { color: var(--text-muted); font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
        .project-image-placeholder svg { opacity: 0.3; }
        .project-tag { position: absolute; top: 12px; left: 12px; padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.72rem; font-weight: 600; background: var(--accent); color: #0A0A0F; text-transform: uppercase; letter-spacing: 0.05em; }
        .project-content { padding: 1.3rem; }
        .project-content h3 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; }
        .project-content p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 1rem; }
        .project-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; color: var(--accent); transition: gap 0.3s; }
        .project-link:hover { gap: 0.7rem; }

        /* TESTIMONIALS */
        .testimonials-section { background: var(--bg-secondary); }
        .testimonials-slider-wrapper { margin-top: 3rem; position: relative; }
        .testimonials-slider { overflow: hidden; border-radius: 14px; }
        .testimonials-track { display: flex; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .testimonial-slide { min-width: 100%; padding: 0 0.25rem; box-sizing: border-box; }
        .testimonial-card { padding: 2rem; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); position: relative; min-height: 220px; display: flex; flex-direction: column; justify-content: space-between; }
        .testimonial-card::before { content: '\201C'; font-family: var(--font-display); font-size: 4rem; font-weight: 800; color: var(--accent); opacity: 0.15; position: absolute; top: 10px; right: 24px; line-height: 1; }
        .testimonial-text { font-size: 0.95rem; color: var(--text-muted); line-height: 1.85; margin-bottom: 1.5rem; font-style: italic; }
        .testimonial-author { display: flex; align-items: center; gap: 0.8rem; }
        .testimonial-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: var(--accent); }
        .testimonial-name { font-weight: 600; font-size: 0.9rem; }
        .testimonial-role { font-size: 0.78rem; color: var(--text-muted); }
        .testimonial-stars { color: #F5A623; font-size: 0.9rem; margin-bottom: 0.8rem; letter-spacing: 2px; }
        .slider-controls { display: flex; align-items: center; justify-content: center; gap: 1.5rem; margin-top: 2rem; }
        .slider-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.3s, background 0.3s, transform 0.2s; }
        .slider-btn:hover { border-color: var(--accent); background: var(--accent-dim); transform: scale(1.05); }
        .slider-btn svg { width: 18px; height: 18px; }
        .slider-dots { display: flex; gap: 0.5rem; }
        .slider-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); border: none; cursor: pointer; transition: background 0.3s, transform 0.3s; }
        .slider-dot.active { background: var(--accent); transform: scale(1.2); }

        /* CTA */
        .cta-section { text-align: center; position: relative; overflow: hidden; }
        .cta-section::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%); border-radius: 50%; pointer-events: none; }
        .cta-content { position: relative; z-index: 1; }
        .cta-content .section-title { max-width: 600px; margin: 0 auto 1rem; }
        .cta-content .section-subtitle { max-width: 480px; margin: 0 auto 2.5rem; }
        .cta-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

        /* FOOTER */
        footer { border-top: 1px solid var(--border); padding: 3rem 0; }
        .footer-content { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem; }
        .footer-left { font-size: 0.85rem; color: var(--text-muted); }
        .footer-left strong { color: var(--text); font-family: var(--font-display); }
        .footer-socials { display: flex; gap: 0.6rem; }
        .social-icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); display: flex; align-items: center; justify-content: center; transition: border-color 0.3s, background 0.3s, transform 0.2s; color: var(--text-muted); }
        .social-icon:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); transform: translateY(-2px); }
        .social-icon svg { width: 18px; height: 18px; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .nav-links { display: none; } .nav-hamburger { display: flex; } .btn-nav { display: none; }
            .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
            .about-image-wrapper { order: -1; max-width: 350px; margin: 0 auto; }
            .hero-trust { gap: 1.5rem; }
            .projects-grid { grid-template-columns: 1fr; }
            .services-grid { grid-template-columns: 1fr; }
            .testimonial-card { padding: 1.8rem; }
            .footer-content { flex-direction: column; text-align: center; }
            .footer-socials { justify-content: center; flex-wrap: wrap; }
        }
        @media (max-width: 600px) {
            .hero h1 { font-size: 1.9rem; }
            .hero-trust { flex-direction: column; gap: 1rem; }
            .trust-item { flex-direction: row; align-items: baseline; gap: 0.5rem; }
            .testimonial-text { font-size: 0.92rem; }
            .section-title { font-size: 1.5rem; }
            .cta-buttons { flex-direction: column; align-items: center; }
            .tools-badges { gap: 0.5rem; }
            .tool-badge { padding: 0.4rem 0.85rem; font-size: 0.78rem; }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="#" class="nav-logo" id="navLogo"></a>
            <div class="nav-links">
                <a href="#about">About</a><a href="#services">Services</a><a href="#projects">Projects</a><a href="#testimonials">Reviews</a><a href="#contact">Contact</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="theme-icon moon">🌙</span><span class="theme-icon sun">☀️</span>
                </button>
                <a href="#" target="_blank" class="btn-nav" id="navBookBtn"></a>
                <button class="nav-hamburger" id="navHamburger" aria-label="Open menu"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>
    <div class="mobile-nav" id="mobileNav">
        <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
        <a href="#about" onclick="closeMobileNav()">About</a><a href="#services" onclick="closeMobileNav()">Services</a><a href="#projects" onclick="closeMobileNav()">Projects</a><a href="#testimonials" onclick="closeMobileNav()">Reviews</a><a href="#contact" onclick="closeMobileNav()">Contact</a>
        <a href="#" target="_blank" onclick="closeMobileNav()" id="mobileBookBtn">Book a Call</a>
    </div>

    <!-- HERO -->
    <section class="hero" id="hero"><div class="container"><div class="hero-content">
        <div class="hero-badge"><span class="dot"></span><span id="heroBadge"></span></div>
        <h1 id="heroHeading"></h1>
        <p class="hero-description" id="heroDesc"></p>
        <div class="hero-ctas" id="heroCtas"></div>
        <div class="hero-trust" id="heroTrust"></div>
    </div></div></section>

    <!-- ABOUT -->
    <section id="about"><div class="container">
        <div class="reveal"><span class="section-label" id="aboutLabel"></span></div>
        <div class="about-grid">
            <div class="about-image-wrapper reveal reveal-delay-1"><div class="about-image" id="aboutImage"></div></div>
            <div class="about-text reveal reveal-delay-2">
                <h2 class="section-title" id="aboutTitle"></h2>
                <div id="aboutParagraphs"></div>
                <p class="about-tagline" id="aboutTagline"></p>
                <div class="tools-strip">
                    <span class="tools-strip-label">Tools I Use</span>
                    <div class="tools-badges" id="aboutTools"></div>
                </div>
            </div>
        </div>
    </div></section>

    <!-- SERVICES -->
    <section id="services" class="services-section"><div class="container">
        <div class="reveal">
            <span class="section-label" id="servicesLabel"></span>
            <h2 class="section-title" id="servicesTitle"></h2>
            <p class="section-subtitle" id="servicesSubtitle"></p>
        </div>
        <div class="services-grid" id="servicesGrid"></div>
    </div></section>

    <!-- PROJECTS -->
    <section id="projects"><div class="container">
        <div class="reveal">
            <span class="section-label" id="projectsLabel"></span>
            <h2 class="section-title" id="projectsTitle"></h2>
            <p class="section-subtitle" id="projectsSubtitle"></p>
        </div>
        <div class="projects-grid" id="projectsGrid"></div>
        <div class="reveal" style="text-align:center; margin-top:2.5rem;" id="projectsCta"></div>
    </div></section>

    <!-- TESTIMONIALS -->
    <section id="testimonials" class="testimonials-section"><div class="container">
        <div class="reveal">
            <span class="section-label" id="testimonialsLabel"></span>
            <h2 class="section-title" id="testimonialsTitle"></h2>
            <p class="section-subtitle" id="testimonialsSubtitle"></p>
        </div>

    <!-- ============================================================
         RENDER ENGINE — POPULATES THE PAGE FROM SITE_DATA
         ============================================================ -->
    <script>
    // Social icon SVG paths
    const SOCIAL_ICONS = {

    };

    const arrowSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    const placeholderSvg = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

    // ============================================================
    // RENDER SITE FROM DATA
    // ============================================================
    function renderSite(data) {
        const d = data;

        // Meta
        document.getElementById('pageTitle').textContent = d.meta.title;
        document.getElementById('pageMeta').setAttribute('content', d.meta.description);

        // Theme
        const html = document.documentElement;
        try { const saved = localStorage.getItem('theme'); if (saved) html.setAttribute('data-theme', saved); else html.setAttribute('data-theme', d.theme.defaultTheme); } catch(e) { html.setAttribute('data-theme', d.theme.defaultTheme); }
        if (d.theme.accentColor !== '#00D4AA') {
            document.documentElement.style.setProperty('--accent', d.theme.accentColor);
            document.documentElement.style.setProperty('--accent-dim', d.theme.accentColor + '22');
            document.documentElement.style.setProperty('--accent-glow', d.theme.accentColor + '40');
        }

        // Nav
        document.getElementById('navLogo').innerHTML = d.nav.logo + '<span>.</span>';
        document.getElementById('navBookBtn').href = d.nav.bookingUrl;
        document.getElementById('navBookBtn').textContent = d.nav.bookingText;
        document.getElementById('mobileBookBtn').href = d.nav.bookingUrl;
        document.getElementById('mobileBookBtn').textContent = d.nav.bookingText;

        // Hero
        document.getElementById('heroBadge').textContent = d.hero.badge;
        document.getElementById('heroHeading').innerHTML = d.hero.heading + ' <span class="highlight">' + d.hero.headingHighlight + '</span>';
        document.getElementById('heroDesc').textContent = d.hero.description;

        let ctasHtml = '';
        ctasHtml += `<a href="${d.hero.primaryCta.url}" ${d.hero.primaryCta.external ? 'target="_blank"' : ''} class="btn-primary">${d.hero.primaryCta.text} ${arrowSvg}</a>`;
        ctasHtml += `<a href="${d.hero.secondaryCta.url}" class="btn-secondary">${d.hero.secondaryCta.text}</a>`;
        document.getElementById('heroCtas').innerHTML = ctasHtml;

        let trustHtml = '';
        d.hero.stats.forEach(s => {
            trustHtml += `<div class="trust-item"><span class="trust-number" data-target="${s.number}" data-suffix="${s.suffix}">0${s.suffix}</span><span class="trust-label">${s.label}</span></div>`;
        });
        document.getElementById('heroTrust').innerHTML = trustHtml;

        // About
        document.getElementById('aboutLabel').textContent = d.about.sectionLabel;
        document.getElementById('aboutImage').innerHTML = d.about.photoUrl
            ? `<img src="${d.about.photoUrl}" alt="${d.about.photoAlt}" style="width:100%;height:100%;object-fit:cover;">`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.85rem;">Your Photo Here</div>`;
        document.getElementById('aboutTitle').textContent = d.about.title;
        document.getElementById('aboutParagraphs').innerHTML = d.about.paragraphs.map(p => `<p>${p}</p>`).join('');
        document.getElementById('aboutTagline').innerHTML = d.about.tagline;
        document.getElementById('aboutTools').innerHTML = d.about.tools.map(t => `<span class="tool-badge">${t}</span>`).join('');

        // Services
        document.getElementById('servicesLabel').textContent = d.services.sectionLabel;
        document.getElementById('servicesTitle').textContent = d.services.title;
        document.getElementById('servicesSubtitle').textContent = d.services.subtitle;
        document.getElementById('servicesGrid').innerHTML = d.services.items.map((s, i) =>
            `<div class="service-card reveal reveal-delay-${i+1}"><div class="service-icon">${s.icon}</div><h3>${s.title}</h3><p>${s.description}</p></div>`
        ).join('');

        // Projects
        document.getElementById('projectsLabel').textContent = d.projects.sectionLabel;
        document.getElementById('projectsTitle').textContent = d.projects.title;
        document.getElementById('projectsSubtitle').textContent = d.projects.subtitle;
        document.getElementById('projectsGrid').innerHTML = d.projects.items.map((p, i) => {
            const imgHtml = p.image
                ? `<img src="${p.image}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;">`
                : `<div class="project-image-placeholder">${placeholderSvg}<span>Project Screenshot</span></div>`;
            return `<div class="project-card reveal reveal-delay-${(i%2)+1}">
                <div class="project-image"><span class="project-tag">${p.tag}</span>${imgHtml}</div>
                <div class="project-content"><h3>${p.title}</h3><p>${p.description}</p>
                <a href="${p.caseStudyUrl}" class="project-link">View Case Study ${arrowSvg}</a></div></div>`;
        }).join('');
        document.getElementById('projectsCta').innerHTML = `<a href="${d.projects.viewAllUrl}" class="btn-secondary">${d.projects.viewAllText} ${arrowSvg}</a>`;

        // Testimonials
        document.getElementById('testimonialsLabel').textContent = d.testimonials.sectionLabel;
        document.getElementById('testimonialsTitle').textContent = d.testimonials.title;
        document.getElementById('testimonialsSubtitle').textContent = d.testimonials.subtitle;
        document.getElementById('testimonialsTrack').innerHTML = d.testimonials.items.map(t =>
            `<div class="testimonial-slide"><div class="testimonial-card"><div>
                <div class="testimonial-stars">${'★'.repeat(t.stars)}</div>
                <p class="testimonial-text">"${t.quote}"</p></div>
                <div class="testimonial-author"><div class="testimonial-avatar">${t.initials}</div>
                <div><div class="testimonial-name">${t.name}</div><div class="testimonial-role">${t.role}</div></div></div></div></div>`
        ).join('');

        // CTA
        document.getElementById('ctaLabel').textContent = d.cta.sectionLabel;
        document.getElementById('ctaTitle').textContent = d.cta.title;
        document.getElementById('ctaSubtitle').textContent = d.cta.subtitle;
        let ctaBtns = `<a href="${d.cta.primaryCta.url}" ${d.cta.primaryCta.external ? 'target="_blank"' : ''} class="btn-primary">${d.cta.primaryCta.text} ${arrowSvg}</a>`;
        ctaBtns += `<a href="${d.cta.secondaryCta.url}" class="btn-secondary">${d.cta.secondaryCta.text}</a>`;
        document.getElementById('ctaButtons').innerHTML = ctaBtns;

        // Footer
        document.getElementById('footerLeft').innerHTML = `<strong>${d.footer.name}</strong><br>&copy; ${d.footer.year} — All rights reserved.`;
        document.getElementById('footerSocials').innerHTML = d.footer.socials.map(s =>
            `<a href="${s.url}" target="_blank" class="social-icon" aria-label="${s.platform}"><svg viewBox="0 0 24 24" fill="currentColor">${SOCIAL_ICONS[s.icon] || ''}</svg></a>`
        ).join('');

        // Init animations after render
        initAnimations();
    }

    // ============================================================
    // ANIMATIONS & INTERACTIONS
    // ============================================================
    function initAnimations() {
        // Scroll reveal
        const obs = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
        document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

        // Counter animation
        const trustSection = document.getElementById('heroTrust');
        if (trustSection) {
            const counterObs = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        e.target.querySelectorAll('[data-target]').forEach(counter => {
                            if (counter.dataset.animated) return;
                            counter.dataset.animated = '1';
                            const target = parseInt(counter.dataset.target), suffix = counter.dataset.suffix || '', duration = 3500, start = performance.now();
                            function ease(t) { return 1 - Math.pow(1 - t, 3); }
                            function tick(now) { const p = Math.min((now - start) / duration, 1); counter.textContent = Math.floor(ease(p) * target) + suffix; if (p < 1) requestAnimationFrame(tick); else counter.textContent = target + suffix; }
                            requestAnimationFrame(tick);
                        });
                        counterObs.unobserve(e.target);
                    }
                });
            }, { threshold: 0.3 });
            counterObs.observe(trustSection);
        }

        // Testimonial slider
        const track = document.getElementById('testimonialsTrack');
        const slides = track ? track.querySelectorAll('.testimonial-slide') : [];
        const dotsContainer = document.getElementById('sliderDots');
        let currentSlide = 0, autoInterval, isPaused = false;

        if (slides.length && dotsContainer) {
            dotsContainer.innerHTML = '';
            slides.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.classList.add('slider-dot');
                if (i === 0) dot.classList.add('active');
                dot.addEventListener('click', () => { goTo(i); resetAuto(); });
                dotsContainer.appendChild(dot);
            });
        }
        function goTo(i) {
            currentSlide = i;
            if (track) track.style.transform = `translateX(-${currentSlide * 100}%)`;
            dotsContainer?.querySelectorAll('.slider-dot').forEach((d, j) => d.classList.toggle('active', j === currentSlide));
        }
        function next() { goTo((currentSlide + 1) % slides.length); }
        function prev() { goTo((currentSlide - 1 + slides.length) % slides.length); }
        document.getElementById('sliderNext')?.addEventListener('click', () => { next(); resetAuto(); });
        document.getElementById('sliderPrev')?.addEventListener('click', () => { prev(); resetAuto(); });
        function startAuto() { autoInterval = setInterval(() => { if (!isPaused) next(); }, 7000); }
        function resetAuto() { clearInterval(autoInterval); startAuto(); }
        if (slides.length > 1) startAuto();
        const sliderW = document.querySelector('.testimonials-slider-wrapper');
        if (sliderW) { sliderW.addEventListener('mouseenter', () => isPaused = true); sliderW.addEventListener('mouseleave', () => isPaused = false); }
        // Touch
        let tx = 0;
        const sl = document.querySelector('.testimonials-slider');
        if (sl) {
            sl.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, { passive: true });
            sl.addEventListener('touchend', e => { const d = tx - e.changedTouches[0].screenX; if (Math.abs(d) > 50) { d > 0 ? next() : prev(); resetAuto(); } }, { passive: true });
        }

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(a => {
            a.addEventListener('click', function(e) { const t = document.querySelector(this.getAttribute('href')); if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth' }); } });
        });
    }

    // ============================================================
    // GLOBAL INTERACTIONS
    // ============================================================
    // Theme toggle
    document.getElementById('themeToggle').addEventListener('click', () => {
        const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', n);
        try { localStorage.setItem('theme', n); } catch(e) {}
    });

    // Navbar scroll
    window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50));

    // Mobile nav
    document.getElementById('navHamburger').addEventListener('click', () => document.getElementById('mobileNav').classList.add('active'));
    document.getElementById('mobileNavClose').addEventListener('click', () => document.getElementById('mobileNav').classList.remove('active'));
    function closeMobileNav() { document.getElementById('mobileNav').classList.remove('active'); }

    // ============================================================
    // BOOT — Load content from Firestore with caching & fallbacks
    // ============================================================
    const FIRESTORE_CACHE_KEY = 'siteContentCache';

    function bootSite() {
        // Step 1: Instant render from cache (if available) so the page loads fast
        let rendered = false;
        let oldCacheJson = null;
        try {
            oldCacheJson = localStorage.getItem(FIRESTORE_CACHE_KEY);
            if (oldCacheJson) {
                renderSite(JSON.parse(oldCacheJson));
                rendered = true;
            }
        } catch(e) {}

        // Step 2: Fetch fresh data from Firestore in the background
        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            db.collection(SITE_DOC_PATH.collection).doc(SITE_DOC_PATH.doc).get()
                .then(doc => {
                    if (doc.exists) {
                        const freshData = doc.data();
                        const freshJson = JSON.stringify(freshData);
                        // Only re-render if content actually changed vs the cache we rendered from
                        if (!rendered || freshJson !== oldCacheJson) {
                            renderSite(freshData);
                        }
                        try { localStorage.setItem(FIRESTORE_CACHE_KEY, freshJson); } catch(e) {}
                    } else if (!rendered && typeof SITE_DATA !== 'undefined') {
                        // No Firestore doc yet — use bundled fallback
                        renderSite(SITE_DATA);
                    }
                })
                .catch(err => {
                    console.warn('Firestore fetch failed, using fallback:', err);
                    if (!rendered && typeof SITE_DATA !== 'undefined') {
                        renderSite(SITE_DATA);
                    }
                });
        } catch (e) {
            // Firebase init failed — use bundled fallback
            console.warn('Firebase init failed, using bundled data:', e);
            if (!rendered && typeof SITE_DATA !== 'undefined') {
                renderSite(SITE_DATA);
            }
        }
    }

    bootSite();
    </script>
