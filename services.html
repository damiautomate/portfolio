<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

    <style>
        :root {
            --accent: #00D4AA; --accent-dim: #00D4AA22; --accent-glow: #00D4AA40;
            --dark-bg: #0A0A0F; --dark-bg-secondary: #12121A; --dark-bg-card: #16161F;
            --dark-text: #E8E8ED; --dark-text-muted: #8888A0; --dark-border: #2A2A3A;
            --light-bg: #F5F3F0; --light-bg-secondary: #EDEAE6; --light-bg-card: #FFFFFF;
            --light-text: #1A1A2E; --light-text-muted: #6B6B80; --light-border: #D8D5D0;
            --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
            --success: #4ADE80; --danger: #FF5A5A;
            --section-padding: clamp(4rem, 10vw, 6rem);
        }
        [data-theme="dark"] { --bg: var(--dark-bg); --bg-secondary: var(--dark-bg-secondary); --bg-card: var(--dark-bg-card); --text: var(--dark-text); --text-muted: var(--dark-text-muted); --border: var(--dark-border); }
        [data-theme="light"] { --bg: var(--light-bg); --bg-secondary: var(--light-bg-secondary); --bg-card: var(--light-bg-card); --text: var(--light-text); --text-muted: var(--light-text-muted); --border: var(--light-border); }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.65; transition: background 0.3s, color 0.3s; }
        a { color: inherit; text-decoration: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        @media (max-width: 640px) { .container { padding: 0 1.25rem; } }

        /* NAV (same as rest of site) */
        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1rem 0; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: transparent; transition: all 0.3s; }
        .navbar.scrolled { background: color-mix(in srgb, var(--bg) 85%, transparent); border-bottom: 1px solid var(--border); }
        .navbar .container { display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
        .nav-logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { font-size: 0.9rem; color: var(--text-muted); transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }
        .nav-actions { display: flex; gap: 0.75rem; align-items: center; }
        .theme-toggle { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .btn-nav { padding: 0.6rem 1.2rem; border-radius: 8px; background: var(--accent); color: #0A0A0F; font-size: 0.88rem; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-nav:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
        .nav-hamburger { display: none; background: none; border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; align-items: center; justify-content: center; flex-direction: column; gap: 3px; }
        .nav-hamburger span { display: block; width: 16px; height: 2px; background: var(--text); border-radius: 2px; }
        .mobile-nav { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; padding: 5rem 2rem 2rem; flex-direction: column; gap: 1.5rem; }
        .mobile-nav.active { display: flex; }
        .mobile-nav a { font-family: var(--font-display); font-size: 1.5rem; color: var(--text); }
        .mobile-nav-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; font-size: 2rem; color: var(--text); cursor: pointer; }
        @media (max-width: 900px) { .nav-links { display: none; } .nav-hamburger { display: flex; } .btn-nav { display: none; } }

        /* PAGE HEADER */
        .page-header { padding: calc(var(--section-padding) + 2rem) 0 3rem; text-align: center; }
        .page-header h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin-bottom: 1.2rem; }
        .page-header p { font-size: 1.05rem; color: var(--text-muted); max-width: 680px; margin: 0 auto; }
        .breadcrumb { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.2rem; display: flex; justify-content: center; gap: 0.5rem; }
        .breadcrumb a { color: var(--accent); transition: opacity 0.2s; }

        /* PRICING GRID */
        .pricing-section { padding: 0 0 var(--section-padding); }
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tier-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2rem 1.8rem;
            display: flex; flex-direction: column;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .tier-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
        .tier-card.highlighted {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--bg-card) 0%, color-mix(in srgb, var(--accent) 6%, var(--bg-card)) 100%);
            box-shadow: 0 8px 32px color-mix(in srgb, var(--accent) 15%, transparent);
        }
        .tier-badge {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            padding: 0.35rem 0.9rem; background: var(--accent); color: #0A0A0F;
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
            border-radius: 50px;
        }
        .tier-name {
            font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
            letter-spacing: -0.015em; margin-bottom: 0.5rem;
        }
        .tier-best-for {
            font-size: 0.82rem; color: var(--text-muted); line-height: 1.55;
            margin-bottom: 1.2rem; min-height: 2.5em;
        }
        .tier-price-wrap { margin-bottom: 0.4rem; display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
        .tier-price-note { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }
        .tier-price {
            font-family: var(--font-display); font-size: 2rem; font-weight: 800;
            letter-spacing: -0.02em; color: var(--text);
        }
        .tier-billing { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 1.3rem; }
        .tier-description {
            font-size: 0.88rem; color: var(--text-muted); line-height: 1.65;
            padding: 0 0 1.2rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border);
            min-height: 3.5em;
        }
        .tier-features {
            list-style: none; padding: 0; margin: 0 0 1.8rem;
            flex: 1;
        }
        .tier-features li {
            display: flex; gap: 0.6rem; font-size: 0.88rem; margin-bottom: 0.7rem;
            color: var(--text); line-height: 1.5;
        }
        .tier-check {
            flex-shrink: 0; width: 18px; height: 18px; margin-top: 0.15rem;
            color: var(--accent);
        }
        .tier-cta {
            width: 100%;
            padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border);
            background: transparent; color: var(--text); font-weight: 600; font-size: 0.92rem;
            font-family: var(--font-body); cursor: pointer;
            transition: all 0.25s; text-align: center;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .tier-cta:hover { background: var(--accent); color: #0A0A0F; border-color: var(--accent); transform: translateY(-2px); }
        .tier-card.highlighted .tier-cta {
            background: var(--accent); color: #0A0A0F; border-color: var(--accent);
        }
        .tier-card.highlighted .tier-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        /* GUARANTEE */
        .guarantee-bar {
            max-width: 800px; margin: 3rem auto 0;
            padding: 1.5rem 2rem;
            background: var(--bg-card); border: 1px solid var(--accent); border-radius: 14px;
            display: flex; align-items: center; gap: 1.2rem;
            position: relative; overflow: hidden;
        }
        .guarantee-bar::before {
            content: ''; position: absolute; inset: 0;
            background: color-mix(in srgb, var(--accent) 8%, transparent);
            z-index: 0;
        }
        .guarantee-bar > * { position: relative; z-index: 1; }
        .guarantee-icon {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--accent); color: #0A0A0F;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 1.5rem;
        }
        .guarantee-text { flex: 1; }
        .guarantee-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; margin-bottom: 0.2rem; }
        .guarantee-desc { font-size: 0.88rem; color: var(--text-muted); line-height: 1.55; }

        /* FAQ */
        .faq-section { padding: var(--section-padding) 0; }
        .faq-header { text-align: center; margin-bottom: 3rem; }
        .faq-label { display: inline-block; font-family: var(--font-display); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 0.8rem; font-weight: 600; }
        .faq-title { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.8rem; }
        .faq-subtitle { color: var(--text-muted); font-size: 1rem; max-width: 600px; margin: 0 auto; }
        .faq-list { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.8rem; }
        .faq-item {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            overflow: hidden; transition: border-color 0.2s;
        }
        .faq-item.open { border-color: var(--accent); }
        .faq-question {
            width: 100%; padding: 1.3rem 1.5rem; border: none; background: none; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; gap: 1rem;
            font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; color: var(--text);
            text-align: left; transition: background 0.2s;
        }
        .faq-question:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
        .faq-icon { flex-shrink: 0; width: 20px; height: 20px; color: var(--accent); transition: transform 0.3s; }
        .faq-item.open .faq-icon { transform: rotate(180deg); }
        .faq-answer {
            max-height: 0; overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .faq-answer-inner {
            padding: 0 1.5rem 1.3rem;
            font-size: 0.92rem; line-height: 1.75; color: var(--text-muted);
        }
        .faq-item.open .faq-answer { max-height: 400px; }

        /* CTA */
        .cta-section { padding: var(--section-padding) 0; text-align: center; }
        .cta-content { max-width: 680px; margin: 0 auto; padding: 3rem 2rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; }
        .section-label { display: inline-block; font-family: var(--font-display); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 0.8rem; font-weight: 600; }
        .cta-content h2 { font-family: var(--font-display); font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.8rem; }
        .cta-content p { color: var(--text-muted); margin-bottom: 1.8rem; font-size: 1rem; }
        .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.5rem; border-radius: 10px; background: var(--accent); color: #0A0A0F; font-weight: 600; font-size: 0.95rem; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }

        /* FOOTER */
        footer { padding: 4rem 0 2.5rem; border-top: 1px solid var(--border); }
        .footer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 2rem; }
        .footer-left { font-size: 0.85rem; color: var(--text-muted); }
        .footer-socials { display: flex; gap: 0.75rem; }
        .social-icon { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card); display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: all 0.2s; }
        .social-icon:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
        .social-icon svg { width: 16px; height: 16px; }

        /* Cookie banner */
        .cookie-banner { position: fixed; bottom: 1.2rem; left: 1.2rem; right: 1.2rem; max-width: 680px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; z-index: 500; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: none; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .cookie-banner.visible { display: flex; }
        .cookie-banner-text { flex: 1; font-size: 0.85rem; color: var(--text-muted); min-width: 280px; }
        .cookie-banner-text strong { color: var(--text); }
        .cookie-banner-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
        .cookie-btn { padding: 0.55rem 1.2rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text); cursor: pointer; transition: all 0.2s; }
        .cookie-btn.primary { background: var(--accent); color: #0A0A0F; border-color: var(--accent); }
        .cookie-btn:hover { transform: translateY(-1px); }
    </style>
</head>

    function esc(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function setupAnalytics(d) {
        const ga4Id = d.meta?.ga4MeasurementId;
        if (!ga4Id || !/^G-[A-Z0-9]+$/.test(ga4Id)) return;
        const enabled = d.meta?.cookieBannerEnabled !== false;
        let consent = null; try { consent = localStorage.getItem('ga_consent'); } catch(e) {}
        if (consent === 'accepted') loadGA4(ga4Id);
        else if (consent === 'declined') return;
        else if (enabled) showCookieBanner(ga4Id);
        else loadGA4(ga4Id);
    }
    function loadGA4(id) {
        if (window.__ga4Loaded) return; window.__ga4Loaded = true;
        const s = document.createElement('script');
        s.async = true; s.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', id, { anonymize_ip: true });
    }
    function showCookieBanner(id) {
        const b = document.getElementById('cookieBanner'); if (!b) return;
        b.classList.add('visible');
        document.getElementById('cookieAccept').addEventListener('click', () => {
            try { localStorage.setItem('ga_consent', 'accepted'); } catch(e) {}
            b.classList.remove('visible'); loadGA4(id);
        });
        document.getElementById('cookieDecline').addEventListener('click', () => {
            try { localStorage.setItem('ga_consent', 'declined'); } catch(e) {}
            b.classList.remove('visible');
        });
    }

    function applyMetaTags(d, t, desc) {
        if (!d?.meta) return;
        const head = document.head;
        if (d.meta.faviconUrl) {
            let f = head.querySelector('link[rel="icon"]');
            if (!f) { f = document.createElement('link'); f.setAttribute('rel','icon'); head.appendChild(f); }
            f.setAttribute('href', d.meta.faviconUrl);
        }
        function setM(sel, attrs, val) {
            if (!val) return;
            let el = head.querySelector(sel);
            if (!el) { el = document.createElement('meta'); Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v)); head.appendChild(el); }
            el.setAttribute('content', val);
        }
        const og = d.meta.ogImage || d.about?.photoUrl || '';
        setM('meta[property="og:title"]', {property:'og:title'}, t);
        setM('meta[property="og:description"]', {property:'og:description'}, desc);
        setM('meta[property="og:image"]', {property:'og:image'}, og);
        setM('meta[property="og:url"]', {property:'og:url'}, window.location.href);
    }

    // ============================================================
    // RENDER SERVICES PAGE
    // ============================================================
    function renderServicesPage(d) {
        // Theme
        try { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.setAttribute('data-theme', d.theme.defaultTheme); } catch(e) {}
        if (d.theme.accentColor !== '#00D4AA') {
            document.documentElement.style.setProperty('--accent', d.theme.accentColor);
            document.documentElement.style.setProperty('--accent-dim', d.theme.accentColor + '22');
            document.documentElement.style.setProperty('--accent-glow', d.theme.accentColor + '40');
        }

        const sp = d.servicesPage || {};

        // Meta
        document.title = sp.meta?.title || 'Services';
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', sp.meta?.description || '');
        applyMetaTags(d, sp.meta?.title, sp.meta?.description);

        // Nav + footer
        document.getElementById('navLogo').innerHTML = d.nav.logo + '<span>.</span>';
        const bookBtn = document.getElementById('navBookBtn');
        bookBtn.href = d.nav.bookingUrl; bookBtn.textContent = d.nav.bookingText;
        document.getElementById('footerLeft').innerHTML = `<strong>${esc(d.footer.name)}</strong><br>&copy; ${d.footer.year} — All rights reserved.`;
        document.getElementById('footerSocials').innerHTML = d.footer.socials.map(s =>
            `<a href="${s.url}" target="_blank" class="social-icon" aria-label="${esc(s.platform)}"><svg viewBox="0 0 24 24" fill="currentColor">${SOCIAL_ICONS[s.icon] || ''}</svg></a>`
        ).join('');

        // Page header
        document.getElementById('headerTitle').textContent = sp.header?.title || 'Services & Pricing';
        document.getElementById('headerSubtitle').textContent = sp.header?.subtitle || '';

        // Pricing tiers
        const tiers = sp.tiers || [];
        const checkSvg = '<svg class="tier-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
        document.getElementById('pricingGrid').innerHTML = tiers.map(t => `
            <div class="tier-card ${t.highlighted ? 'highlighted' : ''}">
                ${t.highlighted ? '<div class="tier-badge">Most Popular</div>' : ''}
                <div class="tier-name">${esc(t.name)}</div>
                <div class="tier-best-for">${esc(t.bestFor || '')}</div>
                <div class="tier-price-wrap">
                    ${t.priceNote ? `<span class="tier-price-note">${esc(t.priceNote)}</span>` : ''}
                    <span class="tier-price">${esc(t.price)}</span>
                </div>
                ${t.billingCycle ? `<div class="tier-billing">${esc(t.billingCycle)}</div>` : ''}
                <div class="tier-description">${esc(t.description || '')}</div>
                <ul class="tier-features">
                    ${(t.features || []).map(f => `<li>${checkSvg}<span>${esc(f)}</span></li>`).join('')}
                </ul>
                <a href="${esc(t.ctaUrl || '#')}" ${t.ctaUrl?.startsWith('http') ? 'target="_blank"' : ''} class="tier-cta">
                    ${esc(t.ctaText || 'Get started')}
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </a>
            </div>
        `).join('');

        // Guarantee
        const g = sp.guarantee || {};
        document.getElementById('guaranteeBar').innerHTML = g.enabled
            ? `<div class="guarantee-bar">
                <div class="guarantee-icon">✓</div>
                <div class="guarantee-text">
                    <div class="guarantee-title">${esc(g.title)}</div>
                    <div class="guarantee-desc">${esc(g.description)}</div>
                </div>
            </div>`
            : '';

        // FAQ
        const faq = d.faq || {};
        if (faq.items?.length > 0) {
            document.getElementById('faqSection').style.display = '';
            document.getElementById('faqLabel').textContent = faq.sectionLabel || '';
            document.getElementById('faqTitle').textContent = faq.title || 'FAQ';
            document.getElementById('faqSubtitle').textContent = faq.subtitle || '';
            document.getElementById('faqList').innerHTML = faq.items.map((item, i) => `
                <div class="faq-item" data-faq-item>
                    <button class="faq-question" data-faq-toggle>
                        <span>${esc(item.question)}</span>
                        <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="faq-answer"><div class="faq-answer-inner">${esc(item.answer)}</div></div>
                </div>
            `).join('');
            // Wire FAQ accordion
            document.querySelectorAll('[data-faq-toggle]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = btn.closest('[data-faq-item]');
                    item.classList.toggle('open');
                });
            });
        } else {
            document.getElementById('faqSection').style.display = 'none';
        }

        // CTA
        const cta = sp.cta || {};
        document.getElementById('ctaLabel').textContent = cta.sectionLabel || '';
        document.getElementById('ctaTitle').textContent = cta.title || '';
        document.getElementById('ctaSubtitle').textContent = cta.subtitle || '';
        document.getElementById('ctaBtnText').textContent = cta.buttonText || 'Book a call';
        document.getElementById('ctaBtn').href = cta.buttonUrl || '#';

        setupAnalytics(d);
        if (typeof window.__loadTawkTo === 'function') window.__loadTawkTo(d);
    }

    // Static handlers
    document.getElementById('themeToggle').addEventListener('click', () => {
        const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', n);
        try { localStorage.setItem('theme', n); } catch(e) {}
    });
    window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50));
    document.getElementById('navHamburger').addEventListener('click', () => document.getElementById('mobileNav').classList.add('active'));
    document.getElementById('mobileNavClose').addEventListener('click', () => document.getElementById('mobileNav').classList.remove('active'));

    // Boot
    const FIRESTORE_CACHE_KEY = 'siteContentCache';
    function dismissSplash() {
        requestAnimationFrame(() => requestAnimationFrame(() => {
            const sp = document.getElementById('initialSplash');
            if (sp) sp.classList.add('loaded');
            setTimeout(() => { if (sp) sp.remove(); }, 500);
        }));
    }
    function bootSite() {
        let rendered = false, init = null;
        try {
            const cached = localStorage.getItem(FIRESTORE_CACHE_KEY);
            if (cached) { init = JSON.parse(cached); rendered = true; }
        } catch(e) {}
        if (!init && typeof SITE_DATA !== 'undefined') init = SITE_DATA;
        if (init) { renderServicesPage(init); dismissSplash(); }
        else setTimeout(dismissSplash, 1500);

        const old = rendered ? localStorage.getItem(FIRESTORE_CACHE_KEY) : null;
        try {
            firebase.initializeApp(firebaseConfig);
            firebase.firestore().collection(SITE_DOC_PATH.collection).doc(SITE_DOC_PATH.doc).get()
                .then(doc => {
                    if (!doc.exists) return;
                    const fresh = doc.data();
                    const freshJson = JSON.stringify(fresh);
                    if (freshJson !== old) renderServicesPage(fresh);
                    try { localStorage.setItem(FIRESTORE_CACHE_KEY, freshJson); } catch(e) {}
                })
                .catch(err => console.warn('Firestore failed:', err));
        } catch(e) { console.warn('Firebase init failed:', e); }
    }
    bootSite();
    </script>
