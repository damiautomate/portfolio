    // ============================================================
    // INPUT HANDLERS (two-way binding + list ops)
    // ============================================================
    function attachInputHandlers(root) {
        // Text/number/url/checkbox/textarea/select binding
        root.querySelectorAll('[data-bind]').forEach(input => {
            input.addEventListener('input', onBindInput);
            input.addEventListener('change', onBindInput);
        });
        // List add/remove/move buttons
        root.querySelectorAll('[data-add]').forEach(btn => btn.addEventListener('click', onAdd));
        root.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', onRemove));
        root.querySelectorAll('[data-move-up]').forEach(btn => btn.addEventListener('click', onMove.bind(null, -1)));
        root.querySelectorAll('[data-move-down]').forEach(btn => btn.addEventListener('click', onMove.bind(null, 1)));
        // Tags input (special case)
        root.querySelectorAll('[data-tags]').forEach(setupTagsInput);
        // Remove-tag buttons
        root.querySelectorAll('[data-remove-tag]').forEach(btn => btn.addEventListener('click', onRemoveTag));
        // Image preview live update (debounced, doesn't destroy container)
        root.querySelectorAll('[data-image]').forEach(input => {
            let debounceTimer;
            const updatePreview = () => {
                const preview = root.querySelector(`[data-preview="${input.dataset.image}"]`);
                if (!preview) return;
                const url = input.value.trim();

                if (!url) {
                    preview.innerHTML = `<span class="preview-placeholder">No image</span>`;
                    return;
                }

                // Basic URL validation: must be http(s):// and have some content after
                if (!/^https?:\/\/.+/i.test(url)) {
                    preview.innerHTML = `<span class="preview-placeholder" style="color:var(--text-muted);">Enter full URL starting with https://</span>`;
                    return;
                }

                // Try loading the image separately (doesn't destroy preview container)
                preview.innerHTML = `<span class="preview-placeholder" style="color:var(--text-muted);">Loading...</span>`;
                const testImg = new Image();
                testImg.onload = () => {
                    // Only update if this URL is still the current value (user hasn't typed more)
                    if (input.value.trim() === url) {
                        preview.innerHTML = '';
                        const imgEl = document.createElement('img');
                        imgEl.src = url;
                        imgEl.alt = 'preview';
                        imgEl.style.cssText = 'width:100%;height:100%;object-fit:cover;';
                        preview.appendChild(imgEl);
                    }
                };
                testImg.onerror = () => {
                    if (input.value.trim() === url) {
                        preview.innerHTML = `<span class="preview-placeholder" style="color:var(--danger);">Can't load image</span>`;
                    }
                };
                testImg.src = url;
            };

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(updatePreview, 500);
            });
            input.addEventListener('blur', updatePreview);
        });
    }

    function onBindInput(e) {
        const path = e.target.dataset.bind;
        // Skip client-specific paths — those are handled by onClientInput
        if (path.startsWith('_client.')) return;

        let value = e.target.type === 'checkbox' ? e.target.checked :
                    e.target.type === 'number' ? (e.target.value === '' ? 0 : Number(e.target.value)) :
                    e.target.value;
        setByPath(data, path, value);
        // Sync text + color pickers
        if (e.target.dataset.sync === 'color' || e.target.type === 'color') {
            const siblings = e.target.parentElement.querySelectorAll(`[data-bind="${path}"]`);
            siblings.forEach(s => { if (s !== e.target) s.value = value; });
        }
        saveDraft();
    }

    function onAdd(e) {
        const path = e.currentTarget.dataset.add;
        const arr = getByPath(data, path);
        if (!Array.isArray(arr)) return;
        arr.push(getDefaultForPath(path));
        saveDraft();
        renderEditor();
    }

    function onRemove(e) {
        const path = e.currentTarget.dataset.remove;
        if (!confirm('Delete this item?')) return;
        removeByPath(data, path);
        saveDraft();
        renderEditor();
    }

    function onMove(delta, e) {
        const path = e.currentTarget.dataset.moveUp || e.currentTarget.dataset.moveDown;
        const [arrPath, idxStr] = splitPathTail(path);
        const idx = Number(idxStr);
        const arr = getByPath(data, arrPath);
        if (!Array.isArray(arr)) return;
        const newIdx = idx + delta;
        if (newIdx < 0 || newIdx >= arr.length) return;
        const [item] = arr.splice(idx, 1);
        arr.splice(newIdx, 0, item);
        saveDraft();
        renderEditor();
    }

    function setupTagsInput(wrap) {
        const input = wrap.querySelector('input');
        const path = wrap.dataset.tags;
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                e.preventDefault();
                const arr = getByPath(data, path);
                arr.push(input.value.trim());
                saveDraft();
                renderEditor();
            }
        });
    }

    function onRemoveTag(e) {
        const path = e.currentTarget.dataset.removeTag;
        removeByPath(data, path);
        saveDraft();
        renderEditor();
    }

    // ============================================================
    // PATH UTILITIES (for "a.b.c.0.field" paths)
    // ============================================================
    function getByPath(obj, path) {
        return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
    }
    function setByPath(obj, path, value) {
        const keys = path.split('.');
        const last = keys.pop();
        const parent = keys.reduce((o, k) => (o[k] ??= {}), obj);
        parent[last] = value;
    }
    function removeByPath(obj, path) {
        const keys = path.split('.');
        const last = keys.pop();
        const parent = keys.reduce((o, k) => (o == null ? undefined : o[k]), obj);
        if (Array.isArray(parent)) parent.splice(Number(last), 1);
        else if (parent) delete parent[last];
    }
    function splitPathTail(path) {
        const i = path.lastIndexOf('.');
        return [path.slice(0, i), path.slice(i + 1)];
    }

    // Default values when adding new items
    function getDefaultForPath(path) {
        // Normalize path: replace numeric indices with '*' and case-study IDs with '{id}'
        // e.g. "caseStudies.njs-royale.challenge.paragraphs" -> "caseStudies.{id}.challenge.paragraphs"
        //      "projectsPage.items.3" -> "projectsPage.items"
        const normalized = path
            .replace(/\.\d+(?=\.|$)/g, '')          // strip numeric indices
            .replace(/^caseStudies\.[^.]+/, 'caseStudies.{id}')
            .replace(/^blog\.posts\.[^.]+/, 'blog.posts.{id}');

        const defaults = {
            // Homepage
            'hero.stats': { number: 0, suffix: '+', label: 'New Stat' },
            'about.paragraphs': 'New paragraph text. Use <strong>text</strong> to bold.',
            'about.tools': 'New Tool',
            'services.items': { icon: '⭐', title: 'New Service', description: 'Service description.' },
            'projects.items': { tag: 'New', image: '', title: 'New Project', description: 'Project description.', caseStudyUrl: '#' },
            'testimonials.items': { stars: 5, quote: 'New testimonial quote.', name: 'Client Name', role: 'Role, Company', initials: 'CN' },
            'footer.socials': { platform: 'New Platform', url: 'https://', icon: 'twitter' },

            // Projects Page
            'projectsPage.stats': { number: 0, suffix: '', label: 'New Stat' },
            'projectsPage.process.steps': { icon: '✨', title: 'New Step', description: 'Step description' },
            'projectsPage.filters': { id: 'new', label: 'New Filter' },
            'projectsPage.items': { category: 'crm', tag: 'New', image: '', industry: 'Industry', title: 'New Project', tools: ['Tool 1'], description: 'Project description.', metric: '— metric —', caseStudyId: '' },

            // Case Studies (paths using {id} wildcard)
            'caseStudies.{id}.challenge.paragraphs': 'New paragraph of challenge description.',
            'caseStudies.{id}.challenge.bullets': 'New pain point or challenge bullet.',
            'caseStudies.{id}.solution.phases': { number: '0N', title: 'New Phase', description: 'Phase description.', image: '', imageCaption: '' },
            'caseStudies.{id}.results.metrics': { number: 0, suffix: '+', label: 'New Metric' },
            'caseStudies.{id}.results.paragraphs': 'New results paragraph.',
            'caseStudies.{id}.quickFacts.tools': 'New Tool',
            'caseStudies.{id}.tools': 'New Tool',

            // Projects Page items tools (nested)
            'projectsPage.items.tools': 'New Tool',

            // Blog
            'blog.categories': { id: 'new', label: 'New Category' },
            'blog.posts.{id}.tags': 'new-tag'
        };

        const value = defaults[normalized];
        if (value === undefined) return '';
        return typeof value === 'object' ? JSON.parse(JSON.stringify(value)) : value;
    }

.badge { display: inline-block; padding: 0.3rem 0.8rem; border: 1px solid var(--border); border-radius: 50px; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; }
.stats { display: flex; gap: 2rem; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
.stat-num { font-family: 'Syne'; font-size: 2rem; font-weight: 800; color: var(--accent); }
.stat-lbl { font-size: 0.85rem; color: var(--text-muted); }
.section-label { display: inline-block; font-family: 'Syne'; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.2rem; }
.card { padding: 1.2rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; }
.card .tag { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 5px; background: var(--accent); color: #0A0A0F; font-size: 0.7rem; font-weight: 600; margin-bottom: 0.5rem; }
.btn { display: inline-block; padding: 0.6rem 1.2rem; border-radius: 8px; background: var(--accent); color: #0A0A0F; font-weight: 600; margin-right: 0.5rem; font-size: 0.85rem; text-decoration: none; }
.btn-sec { background: transparent; border: 1px solid var(--border); color: var(--text); }
.tools { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
.tool { padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.78rem; color: var(--text); background: var(--bg-card); }
.quote { padding: 1rem; border-left: 3px solid var(--accent); margin-top: 0.8rem; font-style: italic; color: var(--text); }
.footer { padding-top: 2rem; color: var(--text-muted); font-size: 0.85rem; text-align: center; }
img { max-width: 200px; border-radius: 10px; display: block; margin: 0.5rem 0; }
.notice { position: fixed; top: 0; left: 0; right: 0; padding: 0.5rem; background: var(--accent); color: #0A0A0F; text-align: center; font-size: 0.8rem; font-weight: 600; z-index: 999; }
</style></head><body>
<div class="notice">⚡ Preview Mode — This is a simplified preview. Upload site-data.js and refresh your real site for full fidelity.</div>
<div class="container" style="margin-top: 2.5rem;">
  <div class="section">
    <span class="badge">● ${esc(d.hero.badge)}</span>
    <h1>${esc(d.hero.heading)} <span class="highlight">${esc(d.hero.headingHighlight)}</span></h1>
    <p>${esc(d.hero.description)}</p>
    <a class="btn" href="${esc(d.hero.primaryCta.url)}">${esc(d.hero.primaryCta.text)} →</a>
    <a class="btn btn-sec" href="${esc(d.hero.secondaryCta.url)}">${esc(d.hero.secondaryCta.text)}</a>
    <div class="stats">${d.hero.stats.map(s => `<div><div class="stat-num">${s.number}${esc(s.suffix)}</div><div class="stat-lbl">${esc(s.label)}</div></div>`).join('')}</div>
  </div>
  <div class="section">
    <span class="section-label">${esc(d.about.sectionLabel)}</span>
    <h2>${esc(d.about.title)}</h2>
    ${d.about.photoUrl ? `<img src="${esc(d.about.photoUrl)}" alt="${esc(d.about.photoAlt)}">` : ''}
    ${d.about.paragraphs.map(p => `<p>${p}</p>`).join('')}
    <p class="quote">${d.about.tagline}</p>
    <div class="tools">${d.about.tools.map(t => `<span class="tool">${esc(t)}</span>`).join('')}</div>
  </div>
  <div class="section">
    <span class="section-label">${esc(d.services.sectionLabel)}</span>
    <h2>${esc(d.services.title)}</h2>
    <p>${esc(d.services.subtitle)}</p>
    <div class="grid">${d.services.items.map(s => `<div class="card"><div style="font-size:1.5rem;">${s.icon}</div><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p></div>`).join('')}</div>
  </div>
  <div class="section">
    <span class="section-label">${esc(d.projects.sectionLabel)}</span>
    <h2>${esc(d.projects.title)}</h2>
    <p>${esc(d.projects.subtitle)}</p>
    <div class="grid">${d.projects.items.map(p => `<div class="card"><span class="tag">${esc(p.tag)}</span><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p></div>`).join('')}</div>
  </div>
  <div class="section">
    <span class="section-label">${esc(d.testimonials.sectionLabel)}</span>
    <h2>${esc(d.testimonials.title)}</h2>
    ${d.testimonials.items.map(t => `<div class="quote">★ ${'★'.repeat(Math.max(0,t.stars-1))} "${esc(t.quote)}" — <strong>${esc(t.name)}</strong>, ${esc(t.role)}</div>`).join('')}
  </div>
  <div class="section" style="text-align:center;">
    <span class="section-label">${esc(d.cta.sectionLabel)}</span>
    <h2>${esc(d.cta.title)}</h2>
    <p>${esc(d.cta.subtitle)}</p>
    <a class="btn" href="${esc(d.cta.primaryCta.url)}">${esc(d.cta.primaryCta.text)} →</a>
  </div>
  <div class="footer"><strong>${esc(d.footer.name)}</strong> — © ${d.footer.year}<br>${d.footer.socials.map(s => esc(s.platform)).join(' · ')}</div>
</div></body></html>`;
    }

    // ============================================================
    // THEME TOGGLE
    // ============================================================
    function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('adminTheme', next); } catch(e) {}
    }

    // ============================================================
    // TOAST
    // ============================================================
    function toast(msg, type = '') {
        const t = document.getElementById('toast');
        t.className = 'toast ' + type;
        t.innerHTML = (type === 'success' ? ICONS.check : type === 'error' ? ICONS.alert : '') + '<span>' + msg + '</span>';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ============================================================
    // BOOT
    // ============================================================
    init();
    </script>

</body>
</html>
