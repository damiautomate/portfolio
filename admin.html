<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Damilare Babalola</title>
    <meta name="robots" content="noindex,nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">

    <!-- Quill.js rich text editor (used for blog posts) -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

    <style>
        /* ============================================================
           ADMIN PANEL — FULL VISUAL EDITOR
           Theme matches your site: accent #00D4AA, dark/light modes
           ============================================================ */
        :root {
            --accent: #00D4AA;
            --accent-dim: #00D4AA22;
            --accent-glow: #00D4AA40;
            --dark-bg: #0A0A0F;
            --dark-bg-secondary: #12121A;
            --dark-bg-card: #16161F;
            --dark-text: #E8E8ED;
            --dark-text-muted: #8888A0;
            --dark-border: #2A2A3A;
            --light-bg: #F5F3F0;
            --light-bg-secondary: #EDEAE6;
            --light-bg-card: #FFFFFF;
            --light-text: #1A1A2E;
            --light-text-muted: #6B6B80;
            --light-border: #D8D5D0;
            --danger: #FF5A5A;
            --success: #4ADE80;
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --sidebar-width: 260px;
        }
        [data-theme="dark"] { --bg: var(--dark-bg); --bg-secondary: var(--dark-bg-secondary); --bg-card: var(--dark-bg-card); --text: var(--dark-text); --text-muted: var(--dark-text-muted); --border: var(--dark-border); }
        [data-theme="light"] { --bg: var(--light-bg); --bg-secondary: var(--light-bg-secondary); --bg-card: var(--light-bg-card); --text: var(--light-text); --text-muted: var(--light-text-muted); --border: var(--light-border); }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.6; transition: background 0.3s, color 0.3s; min-height: 100vh; }
        a { color: var(--accent); text-decoration: none; }
        button { font-family: var(--font-body); cursor: pointer; }

        /* ============================================================
           LOGIN SCREEN
           ============================================================ */
        .login-screen {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: var(--bg); z-index: 9999; padding: 1rem;
        }
        .login-screen.hidden { display: none; }
        .login-card {
            width: 100%; max-width: 400px; padding: 2.5rem;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
        }
        .login-logo {
            font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;
            text-align: center; margin-bottom: 0.4rem; letter-spacing: -0.02em;
        }
        .login-logo span { color: var(--accent); }
        .login-subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .login-input {
            width: 100%; padding: 0.85rem 1rem; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text);
            font-family: var(--font-body); font-size: 0.95rem; margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .login-input:focus { outline: none; border-color: var(--accent); }
        .login-error { color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; text-align: center; min-height: 1.2rem; }
        .login-btn {
            width: 100%; padding: 0.85rem; border-radius: 10px;
            background: var(--accent); color: #0A0A0F; border: none;
            font-size: 0.95rem; font-weight: 600; transition: transform 0.15s, box-shadow 0.2s;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--accent-glow); }
        .login-hint { text-align: center; color: var(--text-muted); font-size: 0.78rem; margin-top: 1.2rem; }

        /* ============================================================
           LAYOUT — SIDEBAR + MAIN
           ============================================================ */
        .app { display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width); flex-shrink: 0;
            background: var(--bg-secondary); border-right: 1px solid var(--border);
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
            padding: 1.5rem 0; display: flex; flex-direction: column;
        }
        .sidebar-header {
            padding: 0 1.5rem 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem;
        }
        .sidebar-logo {
            font-family: var(--font-display); font-size: 1.3rem; font-weight: 800;
            letter-spacing: -0.02em; margin-bottom: 0.2rem;
        }
        .sidebar-logo span { color: var(--accent); }
        .sidebar-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 600; }
        .sidebar-nav { padding: 0 0.75rem; flex: 1; }
        .sidebar-group-label {
            padding: 1rem 0.75rem 0.5rem; font-size: 0.68rem; text-transform: uppercase;
            letter-spacing: 0.12em; color: var(--text-muted); font-weight: 600;
        }
        .sidebar-item {
            display: flex; align-items: center; gap: 0.7rem;
            padding: 0.65rem 0.75rem; border-radius: 8px; font-size: 0.88rem;
            color: var(--text-muted); border: none; background: none; width: 100%; text-align: left;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-item:hover { background: var(--bg-card); color: var(--text); }
        .sidebar-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
        .sidebar-item-icon { width: 18px; height: 18px; flex-shrink: 0; }
        .sidebar-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); margin-top: 1rem; }

        /* MAIN CONTENT */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        /* TOP BAR */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem; border-bottom: 1px solid var(--border);
            background: var(--bg); position: sticky; top: 0; z-index: 50;
        }
        .topbar-title {
            font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em;
        }
        .topbar-actions { display: flex; align-items: center; gap: 0.75rem; }
        .topbar-btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.55rem 1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
            border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
            transition: border-color 0.2s, background 0.2s;
        }
        .topbar-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
        .topbar-btn.primary {
            background: var(--accent); color: #0A0A0F; border-color: var(--accent);
        }
        .topbar-btn.primary:hover { background: var(--accent); box-shadow: 0 4px 16px var(--accent-glow); }
        .topbar-btn svg { width: 14px; height: 14px; }
        .save-indicator { font-size: 0.78rem; color: var(--text-muted); }
        .save-indicator.dirty { color: #F5A623; }
        .save-indicator.saved { color: var(--success); }
        .publish-indicator {
            font-size: 0.72rem; color: var(--text-muted);
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.25rem 0.55rem; border-radius: 5px;
            background: var(--bg-secondary); border: 1px solid var(--border);
        }
        .publish-indicator.behind {
            color: #F5A623; border-color: #F5A62355; background: #F5A62315;
        }
        .publish-indicator.synced { color: var(--success); border-color: var(--success); background: rgba(74, 222, 128, 0.1); }
        .publish-indicator::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: currentColor;
        }

        /* CONTENT AREA */
        .content { padding: 2rem; max-width: 900px; width: 100%; }
        .content-header { margin-bottom: 2rem; }
        .content-header h1 {
            font-family: var(--font-display); font-size: 1.6rem; font-weight: 800;
            letter-spacing: -0.02em; margin-bottom: 0.3rem;
        }
        .content-header p { color: var(--text-muted); font-size: 0.9rem; }

        /* ============================================================
           FORM COMPONENTS
           ============================================================ */
        .section-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem;
        }
        .section-card-title {
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
            margin-bottom: 0.3rem;
        }
        .section-card-desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.2rem; }

        .field { margin-bottom: 1.1rem; }
        .field:last-child { margin-bottom: 0; }
        .field-label {
            display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text);
        }
        .field-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.3rem; }

        .field-input, .field-textarea, .field-select {
            width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text);
            font-family: var(--font-body); font-size: 0.88rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .field-input:focus, .field-textarea:focus, .field-select:focus {
            outline: none; border-color: var(--accent); background: var(--bg-card);
        }
        .field-textarea { resize: vertical; min-height: 80px; line-height: 1.6; font-family: var(--font-body); }
        .field-textarea.small { min-height: 60px; }

        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; }

        /* COLOR PICKER */
        .color-picker-wrap {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.5rem; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg-secondary);
        }
        .color-picker-wrap input[type="color"] {
            width: 40px; height: 40px; border: none; background: none; cursor: pointer; border-radius: 6px;
        }
        .color-picker-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-wrap input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 6px; }
        .color-picker-wrap input[type="text"] {
            flex: 1; border: none; background: none; color: var(--text); font-family: monospace; font-size: 0.88rem;
        }
        .color-picker-wrap input[type="text"]:focus { outline: none; }

        /* IMAGE FIELD */
        .image-field {
            display: flex; gap: 1rem; align-items: flex-start;
        }
        .image-field-preview { width: 100px; height: 100px; border-radius: 8px; background: var(--bg-secondary); border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.7rem; text-align: center; padding: 0.5rem; }
        .image-field-preview img { width: 100%; height: 100%; object-fit: cover; }
        .image-field-preview .preview-placeholder { font-size: 0.7rem; line-height: 1.3; }

        /* ============================================================
           SECTION JUMP NAV (floating right-side TOC)
           ============================================================ */
        .section-jump-nav {
            position: fixed;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.6rem 0.35rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            max-height: 70vh;
            overflow-y: auto;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .section-jump-nav.visible { opacity: 1; pointer-events: auto; }
        .section-jump-item {
            padding: 0.45rem 0.85rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            border: none;
            background: none;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .section-jump-item:hover { background: var(--bg-secondary); color: var(--text); }
        .section-jump-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
        .section-jump-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-muted); opacity: 0.4;
            flex-shrink: 0;
        }
        .section-jump-item.active .section-jump-dot { background: var(--accent); opacity: 1; }

        /* Hide jump nav on small screens */
        @media (max-width: 1240px) { .section-jump-nav { display: none; } }

        /* ============================================================
           COLLAPSIBLE SECTION CARDS
           ============================================================ */
        .section-card.collapsible .section-card-header {
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; user-select: none;
            margin: -1.5rem -1.5rem 0;
            padding: 1.2rem 1.5rem;
            border-radius: 14px 14px 0 0;
            transition: background 0.2s;
        }
        .section-card.collapsible .section-card-header:hover { background: var(--bg-secondary); }
        .section-card.collapsible.collapsed .section-card-header {
            margin-bottom: -1.5rem;
            border-radius: 14px;
        }
        .section-card.collapsible .section-card-title { margin-bottom: 0; }
        .section-card.collapsible .collapse-indicator {
            width: 24px; height: 24px; flex-shrink: 0;
            transition: transform 0.25s;
        }
        .section-card.collapsible.collapsed .collapse-indicator { transform: rotate(-90deg); }
        .section-card.collapsible .section-card-body {
            margin-top: 1.2rem;
            max-height: 10000px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.2s ease, margin-top 0.3s;
        }
        .section-card.collapsible.collapsed .section-card-body {
            max-height: 0; opacity: 0; margin-top: 0;
        }
        .section-card.collapsible .section-card-desc { margin-bottom: 0; }

        /* Scroll target offset so sticky topbar doesn't hide titles */
        .section-card { scroll-margin-top: 90px; }

        /* ============================================================
           QUILL.JS RICH TEXT EDITOR (dark/light theme overrides)
           ============================================================ */
        .ql-toolbar.ql-snow {
            border: 1px solid var(--border); border-bottom: none;
            border-radius: 10px 10px 0 0;
            background: var(--bg-card);
            padding: 0.5rem;
        }
        .ql-container.ql-snow {
            border: 1px solid var(--border);
            border-radius: 0 0 10px 10px;
            background: var(--bg-secondary);
            font-family: var(--font-body);
            font-size: 0.92rem;
        }
        .ql-editor { color: var(--text); min-height: 350px; padding: 1rem 1.2rem; }
        .ql-editor.ql-blank::before { color: var(--text-muted); font-style: normal; }
        .ql-editor h1, .ql-editor h2, .ql-editor h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; }
        .ql-editor a { color: var(--accent); }
        .ql-editor blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; color: var(--text-muted); }
        .ql-editor code, .ql-editor pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 0.1rem 0.3rem; font-family: monospace; }
        .ql-editor pre { padding: 0.8rem; border-radius: 8px; overflow-x: auto; }
        /* Toolbar buttons - fix dark theme */
        [data-theme="dark"] .ql-snow .ql-stroke { stroke: var(--text); }
        [data-theme="dark"] .ql-snow .ql-fill, [data-theme="dark"] .ql-snow .ql-stroke.ql-fill { fill: var(--text); }
        [data-theme="dark"] .ql-snow .ql-picker { color: var(--text); }
        [data-theme="dark"] .ql-snow .ql-picker-options { background: var(--bg-card); border-color: var(--border); }
        [data-theme="dark"] .ql-snow.ql-toolbar button:hover .ql-stroke,
        [data-theme="dark"] .ql-snow.ql-toolbar button.ql-active .ql-stroke { stroke: var(--accent); }
        [data-theme="dark"] .ql-snow.ql-toolbar button:hover .ql-fill,
        [data-theme="dark"] .ql-snow.ql-toolbar button.ql-active .ql-fill { fill: var(--accent); }
        [data-theme="dark"] .ql-snow.ql-toolbar button:hover,
        [data-theme="dark"] .ql-snow.ql-toolbar button.ql-active { color: var(--accent); }
        .ql-tooltip { background: var(--bg-card) !important; border: 1px solid var(--border) !important; color: var(--text) !important; box-shadow: 0 4px 20px rgba(0,0,0,0.2) !important; }
        .ql-tooltip input[type=text] { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text); }
        .image-field-input { flex: 1; }

        /* CHECKBOX */
        .field-checkbox {
            display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none;
        }
        .field-checkbox input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
        .field-checkbox-label { font-size: 0.85rem; }

        /* LIST ITEMS (projects, testimonials, etc.) */
        .list-items { display: flex; flex-direction: column; gap: 1rem; }
        .list-item {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 10px; padding: 1rem; position: relative;
        }
        .list-item-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border);
        }
        .list-item-title {
            font-size: 0.85rem; font-weight: 600; color: var(--text);
            display: flex; align-items: center; gap: 0.5rem;
        }
        .list-item-number {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 50%;
            background: var(--accent-dim); color: var(--accent);
            font-size: 0.72rem; font-weight: 700;
        }
        .list-item-actions { display: flex; gap: 0.3rem; }
        .list-item-btn {
            width: 28px; height: 28px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.2s, color 0.2s;
        }
        .list-item-btn:hover { border-color: var(--accent); color: var(--accent); }
        .list-item-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
        .list-item-btn svg { width: 13px; height: 13px; }
        .list-item-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .list-item-btn:disabled:hover { border-color: var(--border); color: var(--text-muted); }

        .add-item-btn {
            width: 100%; padding: 0.75rem; border-radius: 10px;
            border: 1.5px dashed var(--border); background: transparent; color: var(--text-muted);
            font-size: 0.85rem; font-weight: 500; margin-top: 1rem;
            transition: border-color 0.2s, color 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .add-item-btn:hover { border-color: var(--accent); color: var(--accent); }
        .add-item-btn svg { width: 14px; height: 14px; }

        /* TAGS INPUT (for tools array, etc.) */
        .tags-input {
            min-height: 46px; padding: 0.5rem; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-secondary);
            display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
        }
        .tags-input:focus-within { border-color: var(--accent); }
        .tag-chip {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.3rem 0.65rem; border-radius: 6px;
            background: var(--accent-dim); color: var(--accent);
            font-size: 0.8rem; font-weight: 500;
        }
        .tag-chip-remove {
            background: none; border: none; color: var(--accent); cursor: pointer;
            padding: 0; font-size: 1rem; line-height: 1; opacity: 0.7;
        }
        .tag-chip-remove:hover { opacity: 1; }
        .tags-input input {
            flex: 1; min-width: 120px; border: none; background: none; color: var(--text);
            padding: 0.3rem; font-family: var(--font-body); font-size: 0.85rem;
        }
        .tags-input input:focus { outline: none; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 2000;
            padding: 0.85rem 1.2rem; border-radius: 10px;
            background: var(--bg-card); border: 1px solid var(--border);
            font-size: 0.88rem; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transform: translateY(120%); transition: transform 0.3s ease;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .toast.show { transform: translateY(0); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast svg { width: 16px; height: 16px; }

        /* PREVIEW MODAL */
        .preview-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 3000; display: none; align-items: center; justify-content: center;
            padding: 2rem;
        }
        .preview-modal.active { display: flex; }
        .preview-frame-wrap {
            width: 100%; height: 100%; max-width: 1400px; background: var(--bg);
            border-radius: 14px; overflow: hidden; position: relative;
            border: 1px solid var(--border);
        }
        .preview-close {
            position: absolute; top: 1rem; right: 1rem; z-index: 10;
            width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text); font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }
        .preview-frame-wrap iframe {
            width: 100%; height: 100%; border: none; display: block;
        }

        /* HIDDEN UTILITY */
        .hidden { display: none !important; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .app { flex-direction: column; }
            .sidebar {
                width: 100%; height: auto; position: static; border-right: none;

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        // Theme from localStorage
        try {
            const t = localStorage.getItem('adminTheme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) {
            showLoginError('Firebase setup error: ' + e.message);
            return;
        }

        // Persist auth across browser sessions
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

        // Listen for auth state changes
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                showApp();
            } else {
                currentUser = null;
                document.getElementById('app').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        });

        // Login form
        document.getElementById('loginBtn').addEventListener('click', handleLogin);
        document.getElementById('passwordInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('emailInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // Topbar actions
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);
        document.getElementById('previewBtn').addEventListener('click', openPreview);
        document.getElementById('exportBtn').addEventListener('click', saveDraftToCloud);
        document.getElementById('publishBtn').addEventListener('click', publishToLive);
        document.getElementById('backupBtn').addEventListener('click', downloadBackup);
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);

        // Preview modal
        document.getElementById('previewClose').addEventListener('click', closePreview);
        document.getElementById('previewModal').addEventListener('click', (e) => {
            if (e.target.id === 'previewModal') closePreview();
        });

        // Keyboard: Cmd/Ctrl+S = save draft, Cmd/Ctrl+Shift+P = publish
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDraftToCloud(); }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'P' || e.key === 'p')) { e.preventDefault(); publishToLive(); }
            if (e.key === 'Escape') closePreview();
        });

        // Warn before leaving with unsaved changes
        window.addEventListener('beforeunload', (e) => {
            if (isDirty) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    }

    function showLoginError(msg) {
        document.getElementById('loginError').textContent = msg;
    }

    async function handleLogin() {
        showLoginError('');
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) { showLoginError('Enter email and password'); return; }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        try {
            await auth.signInWithEmailAndPassword(email, password);
            // onAuthStateChanged will take over from here
        } catch (e) {
            let msg = e.message || 'Login failed';
            if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
                msg = 'Incorrect email or password';
            } else if (e.code === 'auth/too-many-requests') {
                msg = 'Too many failed attempts. Try again later.';
            } else if (e.code === 'auth/network-request-failed') {
                msg = 'Network error. Check your connection.';
            }
            showLoginError(msg);
            document.getElementById('passwordInput').value = '';
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    }

    async function handleLogout() {
        if (isDirty && !confirm('You have unsaved changes. Log out anyway?')) return;
        try { localStorage.removeItem(STORAGE_KEY_DATA); } catch(e) {}
        await auth.signOut();
        location.reload();
    }

    async function showApp() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        await loadData();
        renderSidebar();
        renderEditor();
    }

    // ============================================================
    // DATA LOADING & PERSISTENCE (Draft + Published)
    //
    // Firestore structure:
    //   site/draft    — working copy, admin edits here
    //   site/content  — published live version, public site reads here
    //
    // Flow:
    //   1. Admin loads → we read DRAFT (fallback to CONTENT if no draft yet)
    //   2. Admin edits → auto-saved to localStorage, manually "Save Draft" to Firestore
    //   3. Admin clicks "Publish" → promotes DRAFT → CONTENT (live site updates)
    // ============================================================
    async function loadData() {
        showSaveStatus('Loading from cloud...', 'loading');
        try {
            // Always try to load the published content first (for comparison)
            const publishedDoc = await db.collection(SITE_DOC_PATH.collection).doc(SITE_DOC_PATH.doc).get();
            if (publishedDoc.exists) {
                publishedData = publishedDoc.data();
            }

            // Then load the draft — fall back to published if no draft exists
            const draftDoc = await db.collection(DRAFT_DOC_PATH.collection).doc(DRAFT_DOC_PATH.doc).get();
            if (draftDoc.exists) {
                data = applySchemaDefaults(draftDoc.data());
            } else if (publishedData) {
                // No draft yet — clone published as starting point
                data = applySchemaDefaults(JSON.parse(JSON.stringify(publishedData)));
                toast('No draft found — starting from published version', '');
            } else {
                // Neither exists — use bundled SITE_DATA
                toast('No cloud data found. Run migrate.html first to seed initial content.', 'error');
                if (typeof SITE_DATA !== 'undefined') {
                    data = JSON.parse(JSON.stringify(SITE_DATA));
                }
            }

            markClean();
            updatePublishIndicator();

            // Check for unsaved local draft (from a previous session)
            try {
                const localDraft = localStorage.getItem(STORAGE_KEY_DATA);
                if (localDraft) {
                    if (confirm('You have unsaved local changes from your last session. Restore them?')) {
                        data = JSON.parse(localDraft);
                        markDirty();
                    } else {
                        localStorage.removeItem(STORAGE_KEY_DATA);
                    }
                }
            } catch(e) {}

            // Load clients list in parallel (admin only)
            loadClients();

        } catch (e) {
            toast('Error loading from cloud: ' + e.message, 'error');
            // Fallback to bundled data
            try {
                const draft = localStorage.getItem(STORAGE_KEY_DATA);
                if (draft) { data = JSON.parse(draft); markDirty(); return; }
            } catch(er) {}
            if (typeof SITE_DATA !== 'undefined') {
                data = JSON.parse(JSON.stringify(SITE_DATA));
                markDirty();
            }
        }
    }

    // ============================================================

        `<div class="section-card">

            ${field('Availability Badge', 'bookingPage.header.badge', b.header.badge || '', { placeholder: 'e.g. Available for new projects' })}

            ${field('Title', 'bookingPage.header.title', b.header.title || '')}
            ${field('Subtitle', 'bookingPage.header.subtitle', b.header.subtitle || '', { type: 'textarea', rows: 2 })}
        </div>

        <div class="section-card">
            <div class="section-card-title">Track 1 &mdash; The Call</div>
            ${field('Show this track', 'bookingPage.call.enabled', b.call.enabled !== false, { type: 'checkbox' })}
            ${field('Tag', 'bookingPage.call.label', b.call.label || '')}
            ${field('Title', 'bookingPage.call.title', b.call.title || '')}
            ${field('Description', 'bookingPage.call.description', b.call.description || '', { type: 'textarea', rows: 3 })}
            ${field('Duration', 'bookingPage.call.duration', b.call.duration || '')}
            ${field('Cost', 'bookingPage.call.cost', b.call.cost || '')}
            ${field('Button Text', 'bookingPage.call.buttonText', b.call.buttonText || '')}
            ${field('What happens afterwards', 'bookingPage.call.afterwards', b.call.afterwards || '', { type: 'textarea', rows: 3 })}
        </div>` +

    // ============================================================
    // BACKUP
    // Nothing here is version-controlled — Firestore keeps one copy of the
    // document and Publish overwrites it. Take a snapshot before big edits.
    // ============================================================
    function downloadBackup() {
        try {
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            const payload = JSON.stringify({
                exportedAt: new Date().toISOString(),
                source: 'admin.html',
                note: 'Snapshot of the working draft. To restore, paste this back into the site/draft document in the Firebase console, then Publish.',
                content: data
            }, null, 2);
            const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = `site-backup-${stamp}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
            toast('Backup downloaded', 'success');
        } catch (e) {
            toast('Backup failed: ' + e.message, 'error');
        }
    }

    // ============================================================
    // SCHEMA DEFAULTS
    // The stored document is whatever was saved the last time someone hit
    // Publish. When a new section is added to site-data.js, that section does
    // not exist in the stored document — so its editor renders blank, saves
    // blank, and the matching public page renders blank. (This is exactly how
    // the services page went empty.) Filling gaps from site-data.js on load
    // means a new section shows up in the panel the moment it ships.
    // Existing values always win; nothing stored is ever overwritten.
    // ============================================================
    function applySchemaDefaults(loaded) {
        if (typeof SITE_DATA === 'undefined' || !SITE_DATA) return loaded;

        const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
        const isEmpty = v => {
            if (v === undefined || v === null) return true;
            if (typeof v === 'string') return v.trim() === '';
            if (Array.isArray(v)) return v.length === 0;
            if (isObj(v)) return Object.keys(v).length === 0;
            return false;   // false and 0 are real values, not gaps
        };

        const added = [];
        function merge(target, defaults, path) {
            const out = isObj(target) ? { ...target } : {};
            for (const key of Object.keys(defaults)) {
                const here = path ? path + '.' + key : key;
                if (isEmpty(out[key]) && !isEmpty(defaults[key])) {
                    out[key] = JSON.parse(JSON.stringify(defaults[key]));
                    added.push(here);
                } else if (isObj(defaults[key]) && isObj(out[key])) {
                    out[key] = merge(out[key], defaults[key], here);
                }
                // Populated arrays are left alone — merging into them would
                // resurrect items the user deliberately deleted.
            }
            return out;
        }

        const result = merge(loaded || {}, SITE_DATA, '');
        if (added.length) {
            const sections = [...new Set(added.map(p => p.split('.')[0]))];
            console.info('[admin] Restored missing content from schema:', added);
            setTimeout(() => toast(
                `Restored ${added.length} missing value${added.length === 1 ? '' : 's'} (${sections.join(', ')}) — review, then Publish`,
                ''
            ), 900);
        }
        return result;
    }

    async function loadClients() {
        try {
            const doc = await db.collection(CLIENTS_DOC_PATH.collection).doc(CLIENTS_DOC_PATH.doc).get();
            clients = doc.exists ? (doc.data().list || []) : [];
        } catch (e) {
            console.warn('Could not load clients:', e);
            clients = [];
        }
    }

    function saveDraft() {
        // Save working copy to localStorage so refresh doesn't lose work
        try { localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(data)); } catch(e) {}
        markDirty();
    }

    async function saveDraftToCloud() {
        if (!currentUser) { toast('Not signed in', 'error'); return; }
        const btn = document.getElementById('exportBtn');
        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'Saving...';
        showSaveStatus('Saving draft to cloud...', 'loading');
        try {
            await db.collection(DRAFT_DOC_PATH.collection).doc(DRAFT_DOC_PATH.doc).set(data);
            try { localStorage.removeItem(STORAGE_KEY_DATA); } catch(e) {}
            markClean();
            updatePublishIndicator();
            toast('Draft saved to cloud. Click "Publish to Live" when ready.', 'success');
        } catch (e) {
            toast('Save failed: ' + e.message, 'error');
            showSaveStatus('Save failed', 'dirty');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    }

    async function publishToLive() {
        if (!currentUser) { toast('Not signed in', 'error'); return; }
        if (isDirty) {
            if (!confirm('You have unsaved changes. Save draft and publish them too?')) return;
            await saveDraftToCloud();
        }
        if (!confirm('Publish current draft to your LIVE site? All visitors will see these changes.')) return;

        const btn = document.getElementById('publishBtn');
        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'Publishing...';
        try {
            await db.collection(SITE_DOC_PATH.collection).doc(SITE_DOC_PATH.doc).set(data);
            publishedData = JSON.parse(JSON.stringify(data));
            updatePublishIndicator();
            toast('🎉 Published! Your live site is now updated.', 'success');
        } catch (e) {
            toast('Publish failed: ' + e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    }

    function updatePublishIndicator() {
        const ind = document.getElementById('publishIndicator');
        if (!ind) return;
        if (!publishedData) {
            ind.className = 'publish-indicator';
            ind.textContent = 'Never published';
            return;
        }
        const draftJson = JSON.stringify(data);
        const publishedJson = JSON.stringify(publishedData);
        if (draftJson === publishedJson) {
            ind.className = 'publish-indicator synced';
            ind.textContent = 'Live site matches draft';
        } else {
            ind.className = 'publish-indicator behind';
            ind.textContent = 'Draft has unpublished changes';
        }
    }

    function showSaveStatus(text, cls = '') {
        const ind = document.getElementById('saveIndicator');
        if (ind) { ind.textContent = text; ind.className = 'save-indicator ' + cls; }
    }

    function markDirty() {
        isDirty = true;
        showSaveStatus('Unsaved changes', 'dirty');
        updatePublishIndicator();
    }

    function markClean() {
        isDirty = false;
        showSaveStatus('Draft saved', 'saved');
    }

    // ============================================================
    // SECTION JUMP NAV — builds a floating TOC from the card titles
    // ============================================================
    function buildSectionJumpNav() {
        const nav = document.getElementById('sectionJumpNav');
        const cards = document.querySelectorAll('#editorContent .section-card');
        if (!nav) return;

        // Only show jump nav when there are 3+ section cards
        if (cards.length < 3) {
            nav.classList.remove('visible');
            nav.innerHTML = '';
            return;
        }

        // Give each card a stable ID and build jump list
        let html = '';
        cards.forEach((card, i) => {
            const titleEl = card.querySelector('.section-card-title');
            const title = titleEl ? titleEl.textContent.trim() : `Section ${i + 1}`;
            const id = `jump-${i}`;
            card.id = id;
            html += `<button class="section-jump-item" data-jump="${id}">
                <span class="section-jump-dot"></span>
                <span>${title.length > 26 ? title.slice(0, 26) + '…' : title}</span>
            </button>`;
        });
        nav.innerHTML = html;
        nav.classList.add('visible');

        // Click handlers
        nav.querySelectorAll('[data-jump]').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = document.getElementById(btn.dataset.jump);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // Scroll spy — highlight active section
        const observerOpts = { rootMargin: '-90px 0px -60% 0px', threshold: 0 };
        const spy = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    nav.querySelectorAll('.section-jump-item').forEach(b => {
                        b.classList.toggle('active', b.dataset.jump === id);
                    });
                }
            });
        }, observerOpts);
        cards.forEach(c => spy.observe(c));
    }

    // ---- UTILITY: create a section header ----
    function sectionHeader(title, desc) {
        return `<div class="content-header"><h1>${title}</h1>${desc ? `<p>${desc}</p>` : ''}</div>`;
    }

    // ---- UTILITY: create a form field ----
    function field(label, name, value, opts = {}) {
        const { type = 'text', hint = '', placeholder = '', rows } = opts;
        const hintHtml = hint ? `<div class="field-hint">${hint}</div>` : '';
        if (type === 'textarea') {
            return `<div class="field"><label class="field-label">${label}</label>
                <textarea class="field-textarea" data-bind="${name}" rows="${rows || 3}" placeholder="${placeholder}">${esc(value)}</textarea>
                ${hintHtml}</div>`;
        }
        if (type === 'checkbox') {
            return `<div class="field"><label class="field-checkbox">
                <input type="checkbox" data-bind="${name}" ${value ? 'checked' : ''}>
                <span class="field-checkbox-label">${label}</span></label>
                ${hintHtml}</div>`;
        }
        return `<div class="field"><label class="field-label">${label}</label>
            <input type="${type}" class="field-input" data-bind="${name}" value="${esc(value)}" placeholder="${placeholder}">
            ${hintHtml}</div>`;
    }

    // ---- UTILITY: image field with live preview ----
    function imageField(label, name, value, hint = '') {
        // Initial preview: show image if value looks valid, else show placeholder
        // The actual load-validation happens in the input handler
        const previewHtml = value && /^https?:\/\/.+/i.test(value)
            ? `<img src="${esc(value)}" alt="preview" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<span class=\\'preview-placeholder\\' style=\\'color:var(--danger);\\'>Can\\'t load image</span>';">`
            : `<span class="preview-placeholder">No image</span>`;
        return `<div class="field"><label class="field-label">${label}</label>
            <div class="image-field">
                <div class="image-field-preview" data-preview="${name}">${previewHtml}</div>
                <div class="image-field-input">
                    <input type="url" class="field-input" data-bind="${name}" data-image="${name}" value="${esc(value)}" placeholder="https://i.ibb.co/...">
                    ${hint ? `<div class="field-hint">${hint}</div>` : ''}
                </div>
            </div></div>`;
    }

    // ---- UTILITY: escape HTML special chars in attribute values ----
    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

                        : ids.map(id => {
                            const cs = studies[id];
                            return `<div class="list-item" style="cursor:pointer;" data-open-case="${esc(id)}">
                                <div class="list-item-header">
                                    <div class="list-item-title">
                                        <span class="list-item-number">${esc(id)}</span>
                                        ${esc(cs.hero?.title || '(Untitled)')}
                                    </div>
                                    <div class="list-item-actions">
                                        <button class="list-item-btn" data-open-case="${esc(id)}" title="Edit">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                        </button>
                                        <button class="list-item-btn danger" data-delete-case="${esc(id)}" title="Delete">${ICONS.del}</button>
                                    </div>
                                </div>
                                <div style="font-size: 0.82rem; color: var(--text-muted); padding-left: 34px;">
                                    ${esc(cs.hero?.client || '')} • ${esc(cs.hero?.tag || '')}
                                </div>
                            </div>`;
                        }).join('')
                    }
                </div>

                <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <label class="field-label">Create new case study</label>
                    <div style="display:flex; gap: 0.5rem;">
                        <input type="text" class="field-input" id="newCaseStudyId" placeholder="url-safe-id (e.g. njs-royale)" style="flex: 1;">
                        <button class="topbar-btn primary" id="createCaseStudyBtn">${ICONS.add} Create</button>
                    </div>
                    <div class="field-hint">Use lowercase letters, numbers, and hyphens only. The ID becomes the URL: <code>case-study.html?id=<span id="idPreview">your-id</span></code></div>
                </div>
            </div>`;

        // Wire events
        el.querySelectorAll('[data-open-case]').forEach(e => {
            e.addEventListener('click', (ev) => {
                // If click landed on the delete button (inside the card), ignore here
                if (ev.target.closest('[data-delete-case]')) return;
                ev.stopPropagation();
                activeCaseStudyId = e.dataset.openCase;
                renderEditor();
            });
        });
        el.querySelectorAll('[data-delete-case]').forEach(e => {
            e.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const id = e.dataset.deleteCase;
                if (confirm(`Delete case study "${id}"? This cannot be undone.`)) {
                    delete data.caseStudies[id];
                    saveDraft();
                    renderEditor();
                }
            });
        });
        const idInput = document.getElementById('newCaseStudyId');
        const idPreview = document.getElementById('idPreview');
        idInput?.addEventListener('input', () => {
            const slug = idInput.value.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-');
            if (slug !== idInput.value) idInput.value = slug;
            idPreview.textContent = slug || 'your-id';
        });
        document.getElementById('createCaseStudyBtn')?.addEventListener('click', () => {
            const id = (idInput.value || '').trim();
            if (!id) { toast('Enter an ID', 'error'); return; }
            if (data.caseStudies && data.caseStudies[id]) { toast('A case study with that ID already exists', 'error'); return; }
            if (!data.caseStudies) data.caseStudies = {};
            data.caseStudies[id] = defaultCaseStudy();
            saveDraft();
            activeCaseStudyId = id;
            renderEditor();
        });
    }

        // Wire handlers
        document.getElementById('addClientBtn')?.addEventListener('click', () => {
            clients.push(defaultClient());
            saveClientsToCloud();
            activeClientId = clients.length - 1;
            renderEditor();
        });

        document.getElementById('clientSearch')?.addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            document.querySelectorAll('[data-client-row]').forEach(row => {
                const searchText = row.dataset.searchText || '';
                row.style.display = !q || searchText.includes(q) ? '' : 'none';
            });

        document.querySelectorAll('[data-open-client]').forEach(e => {
            e.addEventListener('click', (ev) => {
                if (ev.target.closest('[data-delete-client]')) return;
                ev.stopPropagation();
                activeClientId = Number(e.dataset.openClient);
                renderEditor();
            });
        });
        document.querySelectorAll('[data-delete-client]').forEach(e => {
            e.addEventListener('click', async (ev) => {
                ev.stopPropagation();
                const idx = Number(e.dataset.deleteClient);
                const client = clients[idx];
                if (confirm(`Delete client "${client.name}"? This cannot be undone.`)) {
                    clients.splice(idx, 1);
                    await saveClientsToCloud();
                    renderEditor();

    function renderClientRow(c, i) {
        const statusColors = { active: 'var(--success)', lead: '#F5A623', past: 'var(--text-muted)' };
        const statusColor = statusColors[c.status] || 'var(--text-muted)';
        const searchText = [c.name, c.company, c.industry, c.email, c.projectType].filter(Boolean).join(' ').toLowerCase();

        return `<div class="list-item" data-client-row data-search-text="${esc(searchText)}" data-open-client="${i}" style="cursor:pointer;">
            <div class="list-item-header">
                <div class="list-item-title">
                    <span class="list-item-number" style="background:${statusColor}22;color:${statusColor};">${(c.name || '?').substring(0, 2).toUpperCase()}</span>
                    <span>${esc(c.name || '(No name)')}</span>
                    <span style="font-size:0.7rem;color:${statusColor};text-transform:uppercase;letter-spacing:0.08em;margin-left:0.4rem;">${esc(c.status || '')}</span>
                </div>
                <div class="list-item-actions">
                    <button class="list-item-btn" data-open-client="${i}" title="Edit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="list-item-btn danger" data-delete-client="${i}" title="Delete">${ICONS.del}</button>
                </div>

            <div style="font-size: 0.8rem; color: var(--text-muted); padding-left: 34px; line-height: 1.5;">

                ${c.industry ? ` • ${esc(c.industry)}` : ''}
                ${c.projectType ? `<br>${esc(c.projectType)}` : ''}
            </div>
        </div>`;
    }

            sectionHeader(`Edit Client: ${esc(c.name || 'Untitled')}`, 'Private client record. Changes save automatically to the cloud.') +

            `<div class="section-card">
                <div class="section-card-title">Basic Info</div>
                <div class="field-row">
                    ${field('Full Name', `_client.name`, c.name, { hint: 'First and last name' })}
                    ${field('Company', `_client.company`, c.company || '')}
                </div>
                <div class="field-row">
                    ${field('Industry', `_client.industry`, c.industry || '', { placeholder: 'e.g. E-commerce, SaaS, Real Estate' })}
                    <div class="field"><label class="field-label">Status</label>
                        <select class="field-select" data-bind="_client.status">
                            <option value="lead" ${c.status === 'lead' ? 'selected' : ''}>Lead (prospect)</option>
                            <option value="active" ${c.status === 'active' ? 'selected' : ''}>Active (working with them)</option>

            </div>

            <div class="section-card">

                <div class="field-row">
                    ${field('Email', `_client.email`, c.email || '', { type: 'email' })}
                    ${field('Phone / WhatsApp', `_client.phone`, c.phone || '', { type: 'tel' })}
                </div>
                <div class="field-row">
                    ${field('Website', `_client.website`, c.website || '', { type: 'url' })}
                    ${field('LinkedIn / Social', `_client.social`, c.social || '', { type: 'url' })}
                </div>
            </div>

            <div class="section-card">
                <div class="section-card-title">Project Details</div>
                ${field('Project Type / Service', `_client.projectType`, c.projectType || '', { placeholder: 'e.g. Zoho CRM Setup, n8n Automation' })}
                <div class="field-row">
                    ${field('Start Date', `_client.startDate`, c.startDate || '', { type: 'date' })}
                    ${field('End Date (if completed)', `_client.endDate`, c.endDate || '', { type: 'date' })}
                </div>
                ${field('Project Value (optional)', `_client.value`, c.value || '', { placeholder: 'e.g. $500, ₦350,000' })}
                ${field('Tools Used', `_client.tools`, c.tools || '', { placeholder: 'e.g. Zoho CRM, n8n, Make' })}
            </div>

            <div class="section-card">
                <div class="section-card-title">Private Notes</div>
                <div class="section-card-desc">Only you can see these. Use for reminders, preferences, pricing context, etc.</div>
                ${field('Notes', `_client.notes`, c.notes || '', { type: 'textarea', rows: 6 })}
            </div>

            <div style="display:flex;gap:0.75rem;margin-top:1rem;align-items:center;">
                <button class="topbar-btn primary" id="saveClientBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>

                </button>
                <span style="font-size:0.8rem;color:var(--text-muted);">Changes save automatically as you type.</span>
            </div>`;

        // Handle _client.* bindings (different from site data — goes into clients[idx])
        el.querySelectorAll('[data-bind^="_client."]').forEach(input => {
            input.addEventListener('input', onClientInput);
            input.addEventListener('change', onClientInput);
        });

        document.getElementById('backToClients')?.addEventListener('click', async () => {
            // Flush any pending auto-save
            clearTimeout(clientSaveTimer);
            await saveClientsToCloud();
            activeClientId = null;
            renderEditor();
        });
        document.getElementById('saveClientBtn')?.addEventListener('click', async () => {
            // Flush any pending auto-save immediately
            clearTimeout(clientSaveTimer);
            await saveClientsToCloud();
            toast('Client saved', 'success');
            activeClientId = null;
            renderEditor();
        });
    }

    function onClientInput(e) {
        if (activeClientId === null) return;
        const field = e.target.dataset.bind.replace('_client.', '');
        const value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
        clients[activeClientId][field] = value;
        // Debounced auto-save
        clearTimeout(clientSaveTimer);
        clientSaveTimer = setTimeout(() => { saveClientsToCloud(); }, 800);
    }
    let clientSaveTimer = null;

    async function saveClientsToCloud() {
        if (!currentUser) return;
        try {
            await db.collection(CLIENTS_DOC_PATH.collection).doc(CLIENTS_DOC_PATH.doc).set({ list: clients });
        } catch (e) {
            toast('Error saving clients: ' + e.message, 'error');
        }
    }

    function defaultClient() {
        return {

            company: '',

            status: 'lead',
            email: '',
            phone: '',
            website: '',
            social: '',
            projectType: '',
            startDate: '',
            endDate: '',
            value: '',
            tools: '',
            notes: ''
        };
    }

    // ============================================================
    // BLOG POSTS — LIST VIEW
    // ============================================================
    function renderBlogPostsListEditor(el) {
        if (!data.blog) { data.blog = defaultBlog(); saveDraft(); }
        if (!data.blog.posts) data.blog.posts = {};

        const postIds = Object.keys(data.blog.posts);
        const posts = postIds.map(id => ({ id, ...data.blog.posts[id] }));
        const published = posts.filter(p => p.published).length;
        const drafts = posts.filter(p => !p.published).length;

        el.innerHTML = sectionHeader('Blog Posts', 'Create and manage blog posts. Posts marked as <strong>draft</strong> are not visible on your public site.') +

            `<div class="section-card">
                <div class="section-card-title">Summary</div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:0.5rem;">
                    <div style="padding:1rem;background:var(--bg-secondary);border-radius:10px;text-align:center;">
                        <div style="font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:var(--accent);">${posts.length}</div>
                        <div style="font-size:0.78rem;color:var(--text-muted);">Total Posts</div>
                    </div>
                    <div style="padding:1rem;background:var(--bg-secondary);border-radius:10px;text-align:center;">
                        <div style="font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:var(--success);">${published}</div>
                        <div style="font-size:0.78rem;color:var(--text-muted);">Published</div>
                    </div>
                    <div style="padding:1rem;background:var(--bg-secondary);border-radius:10px;text-align:center;">
                        <div style="font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:#F5A623;">${drafts}</div>
                        <div style="font-size:0.78rem;color:var(--text-muted);">Drafts</div>
                    </div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-card-title">All Blog Posts</div>
                <div class="section-card-desc">Click any post to edit. Draft posts are hidden from your public site until published.</div>
                <div class="list-items">
                    ${postIds.length === 0
                        ? `<div style="padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">No blog posts yet. Create your first one below.</div>`
                        : posts.sort((a, b) => (b.publishedDate || '').localeCompare(a.publishedDate || '')).map(p => {
                            const statusColor = p.published ? 'var(--success)' : '#F5A623';
                            const statusLabel = p.published ? (p.featured ? 'FEATURED' : 'PUBLISHED') : 'DRAFT';
                            return `<div class="list-item" style="cursor:pointer;" data-open-post="${esc(p.id)}">
                                <div class="list-item-header">
                                    <div class="list-item-title">
                                        <span class="list-item-number" style="background:${statusColor}22;color:${statusColor};">${esc((p.title || '?').substring(0, 2).toUpperCase())}</span>
                                        <span>${esc(p.title || '(Untitled)')}</span>
                                        <span style="font-size:0.68rem;color:${statusColor};text-transform:uppercase;letter-spacing:0.08em;margin-left:0.4rem;">${statusLabel}</span>
                                    </div>
                                    <div class="list-item-actions">
                                        <button class="list-item-btn" data-open-post="${esc(p.id)}" title="Edit">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

                                        <button class="list-item-btn danger" data-delete-post="${esc(p.id)}" title="Delete">${ICONS.del}</button>
                                    </div>
                                </div>
                                <div style="font-size: 0.8rem; color: var(--text-muted); padding-left: 34px;">
                                    ${esc(p.excerpt || '').substring(0, 120)}${(p.excerpt || '').length > 120 ? '…' : ''}
                                    <br><span style="font-size:0.72rem;">${esc(categoryLabel(p.category))} · ${esc(p.publishedDate || 'no date')} · ${p.readTimeMinutes || 3} min read</span>
                                </div>
                            </div>`;
                        }).join('')
                    }
                </div>

                <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <label class="field-label">Create new blog post</label>
                    <div style="display:flex; gap: 0.5rem;">
                        <input type="text" class="field-input" id="newBlogPostId" placeholder="url-safe-id (e.g. how-to-setup-zoho-crm)" style="flex: 1;">
                        <button class="topbar-btn primary" id="createBlogPostBtn">${ICONS.add} Create Post</button>
                    </div>
                    <div class="field-hint">URL-safe ID. Use lowercase letters, numbers, and hyphens. This becomes the URL: <code>blog-post.html?id=<span id="blogIdPreview">your-id</span></code></div>
                </div>
            </div>`;

        // Handlers
        el.querySelectorAll('[data-open-post]').forEach(e => {
            e.addEventListener('click', (ev) => {
                if (ev.target.closest('[data-delete-post]')) return;
                ev.stopPropagation();
                activeBlogPostId = e.dataset.openPost;
                renderEditor();
            });
        });
        el.querySelectorAll('[data-delete-post]').forEach(e => {
            e.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const id = e.dataset.deletePost;
                if (confirm(`Delete blog post "${id}"? This cannot be undone.`)) {
                    delete data.blog.posts[id];
                    saveDraft();
                    renderEditor();
                }
            });
        });
        const idInput = document.getElementById('newBlogPostId');

        idInput?.addEventListener('input', () => {
            const slug = idInput.value.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-');

            idPreview.textContent = slug || 'your-id';

            saveDraft();
            activeBlogPostId = id;
            renderEditor();
        });
    }

        return cat ? cat.label : (catId || 'Uncategorized');

                <div>
                    <div style="font-weight: 600; font-size: 0.9rem;">Preview this post</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Opens <code>blog-post.html?id=${esc(postId)}</code> in a new tab. <strong>Shows the LIVE published version</strong> — click "Publish to Live" first to see your latest draft changes.</div>
                </div>
                <a href="blog-post.html?id=${encodeURIComponent(postId)}" target="_blank" class="topbar-btn">Open Preview →</a>
            </div>`;

        // Initialize Quill.js
        setTimeout(() => initQuill(postId), 30);

        // Back button
        document.getElementById('backToBlogPosts')?.addEventListener('click', () => {
            // Save any pending Quill content
            if (quillEditor && data.blog?.posts?.[postId]) {
                data.blog.posts[postId].content = quillEditor.root.innerHTML;
                saveDraft();
            }
            quillEditor = null;
            activeBlogPostId = null;
            renderEditor();
        });
    }

    function initQuill(postId) {
        const host = document.getElementById('quillEditorHost');
        if (!host || typeof Quill === 'undefined') return;

        // Style the editor for our theme
        const toolbarOptions = [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'list': 'ordered' }, { 'list': 'bullet' }],
            [{ 'align': [] }],
            ['blockquote', 'code-block'],
            ['link', 'image'],
            [{ 'color': [] }, { 'background': [] }],
            ['clean']
        ];

        quillEditor = new Quill(host, {
            theme: 'snow',
            placeholder: 'Write your blog post here...',
            modules: { toolbar: toolbarOptions }
        });

        // Set initial content
        const post = data.blog?.posts?.[postId];
        if (post?.content) {
            quillEditor.root.innerHTML = post.content;
        }

        // Auto-save on change (debounced)
        let quillDebounce;
        quillEditor.on('text-change', () => {
            clearTimeout(quillDebounce);
            quillDebounce = setTimeout(() => {
                if (data.blog?.posts?.[postId]) {
                    data.blog.posts[postId].content = quillEditor.root.innerHTML;
                    saveDraft();
                }
            }, 400);
        });

        // Set min-height so it feels usable
        const editorEl = host.querySelector('.ql-editor');
        if (editorEl) { editorEl.style.minHeight = '350px'; editorEl.style.fontSize = '0.92rem'; }
    }

    function exportSubmissionsCSV(items, type) {
        if (!items || items.length === 0) { toast('Nothing to export', 'error'); return; }
        let csv;
        if (type === 'newsletterSubscribers') {
            csv = 'email,date\n' + items.map(i => `${escCSV(i.email)},${escCSV(i.submittedAt || '')}`).join('\n');
        } else if (type === 'leads') {
            csv = 'name,email,resource,date\n' + items.map(i => `${escCSV(i.name)},${escCSV(i.email)},${escCSV(i.resource)},${escCSV(i.submittedAt || '')}`).join('\n');
        } else {
            csv = 'name,email,project_type,message,date\n' + items.map(i => `${escCSV(i.name)},${escCSV(i.email)},${escCSV(i.projectType)},${escCSV(i.message)},${escCSV(i.submittedAt || '')}`).join('\n');
        }
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${type}-${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast(`Exported ${items.length} rows`, 'success');
    }
    function escCSV(v) {
        if (v == null) return '';
        const s = String(v);
        return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g, '""')}"` : s;
    }
