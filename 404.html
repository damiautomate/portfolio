<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Damilare Babalola</title>
<meta name="description" content="That page doesn't exist. Here's where to go instead.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0A0A0F">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#0066FE; --accent-text: #4D94FF; --accent-dim:#0066FE22; --accent-glow:#0066FE55;
    --dark-bg:#0A0A0F; --dark-bg-card:#16161F; --dark-text:#E8E8ED;
    --dark-text-muted:#8888A0; --dark-border:#2A2A3A;
    --light-bg:#F5F3F0; --light-bg-card:#FFFFFF; --light-text:#1A1A2E;
    --light-text-muted:#6B6B80; --light-border:#D8D5D0;
    --font-display:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  }
  [data-theme="dark"]{--bg:var(--dark-bg);--card:var(--dark-bg-card);--text:var(--dark-text);--muted:var(--dark-text-muted);--border:var(--dark-border)}
  [data-theme="light"]{ --accent-text: #0052E0;--bg:var(--light-bg);--card:var(--light-bg-card);--text:var(--light-text);--muted:var(--light-text-muted);--border:var(--light-border)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);
    min-height:100vh;display:grid;place-items:center;padding:2rem 1.25rem;
    text-align:center;transition:background .3s,color .3s;position:relative;overflow-x:hidden}
  /* Same ambient glow the homepage hero uses, so a dead end still feels like the site */
  body::before{content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
    width:min(900px,120vw);height:600px;background:radial-gradient(ellipse at center,var(--accent-glow),transparent 65%);
    opacity:.28;pointer-events:none;filter:blur(40px)}
  .wrap{position:relative;max-width:560px}
  .code{font-family:var(--font-display);font-weight:800;font-size:clamp(4.5rem,18vw,9rem);
    line-height:.9;letter-spacing:-.05em;color:var(--accent);margin-bottom:.6rem}
  h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.4rem,4.5vw,2rem);
    letter-spacing:-.02em;margin-bottom:.8rem}
  p{color:var(--muted);font-size:1rem;line-height:1.7;margin-bottom:2rem}
  .links{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-bottom:2.5rem}
  .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.5rem;border-radius:10px;
    font-family:var(--font-display);font-weight:700;font-size:.92rem;text-decoration:none;transition:transform .18s,opacity .18s}
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:var(--accent);color:#06110d}
  .btn.ghost{border:1px solid var(--border);color:var(--text)}
  .quick{border-top:1px solid var(--border);padding-top:1.5rem}
  .quick-label{font-family:var(--font-display);font-size:.72rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:.9rem}
  .quick a{color:var(--text);text-decoration:none;font-size:.9rem;padding:.35rem .8rem;border-radius:99px;
    border:1px solid var(--border);display:inline-block;margin:.2rem;transition:border-color .18s,color .18s}
  .quick a:hover{border-color:var(--accent);color:var(--accent)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be out of date, or the address has a typo in it. Nothing is broken on your end.</p>

    <div class="links">
      <a href="/" class="btn primary">Back to the homepage</a>
      <a href="contact.html" class="btn ghost">Tell me what you were looking for</a>
    </div>

    <div class="quick">
      <div class="quick-label">Or jump to</div>
      <a href="services.html">Services &amp; pricing</a>
      <a href="projects.html">Projects</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>

<script>
  // Match whatever theme the visitor picked elsewhere on the site.
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</body>
</html>
